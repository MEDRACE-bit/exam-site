body{margin:0;background:#140a0a;color:#f4eaea;font:16px Cairo,system-ui,sans-serif}
.brand{max-width:560px;margin:0 auto;padding:10px 12px 0;display:flex;align-items:center;direction:ltr;gap:12px}.brand img{width:52px;height:52px;border-radius:12px;display:block;flex:none}.brand b{flex:1;text-align:center;font-size:1.35em;font-weight:900;letter-spacing:1px;padding-right:52px}
#app{max-width:560px;margin:auto;padding:12px}
.card{background:#241212;border:1px solid #3a1c1c;border-radius:14px;padding:16px;margin:10px 0}
input,textarea,select{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #3a1c1c;background:#1b0d0d;color:inherit;font:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.btn{width:100%;padding:12px;border:0;border-radius:10px;background:#c0262d;font-weight:700;margin-top:6px}
.btn:disabled{opacity:.5}
.ic{display:inline-block;width:38px;height:38px;vertical-align:middle;margin-inline-end:10px}.ic svg,.ic img{width:100%;height:100%;display:block;object-fit:contain}
.btn.ok{background:#1f7a3d}.btn.no{background:#555}
.link{background:none;border:0;color:#e88;padding:6px}
.back{display:inline-flex;align-items:center;gap:6px;background:#2a1414;border:1px solid #c0262d;color:#ffd0d0;border-radius:14px;padding:8px 18px;margin:8px 0;font:inherit;font-weight:700;cursor:pointer}.back:active{background:#3a1c1c}.bar .back{margin:0}
.pill{background:#3a1c1c;border:0;border-radius:20px;padding:6px 12px}
.tbar{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;background:#102b17;border:1px solid #1f6b36;color:#8be6a5;border-radius:10px;padding:8px 12px;margin:8px 0;font-size:.95em}.tbar b{font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}.tbar.lock{background:#2b1010;border-color:#7a2323;color:#ffb3b3}.tbar .btn{margin:0;width:auto;padding:8px 14px}.sub.locked{opacity:.6;cursor:default}
.note{background:#10202b;border:1px solid #1f5f7a;color:#a8dcf5;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:.92em;line-height:1.7}.note a{color:#ffd54a;font-weight:700;text-decoration:underline}
.rate{background:#2b2410;border:1px solid #6b5410;color:#ffd54a;border-radius:10px;padding:8px 12px;margin:8px 0;font-size:.9em;text-align:center}
.coin{display:inline-block;width:1.15em;height:1.15em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe98a,#f2b900 60%,#b98300);border:2px solid #ffd54a;box-shadow:inset 0 0 0 2px #c99400;vertical-align:-.2em;margin-left:4px;position:relative}
.coin:after{content:'C';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 .7em/1 Arial,sans-serif;color:#7a5200}
.top,.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sub,.ch{display:block;width:100%;text-align:start;padding:14px;margin:8px 0;border-radius:12px;border:1px solid #3a1c1c;background:#241212}
.ch{background:#1b0d0d;padding:12px;margin:6px 0}
.ch.ok{border-color:#2e9e5b;background:#12301f}
.ch.bad{border-color:#d64545;background:#3a1414}
.row{display:flex;gap:6px;margin:6px 0}
.row button{flex:1;padding:10px;border-radius:10px;border:1px solid #3a1c1c;background:#1b0d0d}
.row .on{background:#c0262d;border-color:#c0262d}
.msg{color:#e88;min-height:1.2em}
.q{font-size:18px;line-height:1.7}
.ml{margin:6px 0;line-height:1.8}.ml.pt{margin-inline-start:6px}.svb{color:#fff;background:#241212;border:1px solid #c0262d;border-radius:10px;padding:8px 12px}.svh{margin:14px 0 4px;color:#e88;font-weight:700}.svs{margin:8px 0 2px;color:#aaa;font-size:13px}.sqi{display:block;width:100%;text-align:start;padding:10px 12px;margin:5px 0;border-radius:10px;border:1px solid #3a1c1c;background:#1b0d0d;line-height:1.6}
.pb{height:4px;background:#3a1c1c;border-radius:4px;margin-top:8px}
.pb i{display:block;height:100%;background:#c0262d;border-radius:4px}
.crumb{color:#a88;font-size:13px;margin:8px 0}
.lrow{display:flex;gap:8px;align-items:stretch}.lrow .sub{flex:1;width:auto}.wbox{flex:0 0 64px;margin:8px 0;border-radius:12px;border:1px solid #c0262d;background:#241212;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px}.wbox.off{opacity:.35;border-color:#3a1c1c}.wbox b{font-size:16px}
.sub.mine{border-color:#c0262d}
h3{margin:16px 0 4px;color:#e88}

.sub30 .btn{margin-top:8px}

@media print{body{display:none!important}}

const mem = {};
const ls = {
  get: k => { try { return localStorage.getItem(k) } catch (e) { return mem[k] == null ? null : mem[k] } },
  set: (k, v) => { mem[k] = v; try { localStorage.setItem(k, v) } catch (e) {} },
  del: k => { delete mem[k]; try { localStorage.removeItem(k) } catch (e) {} }
};
/* ====== عدّل القيم دي بس ====== */
const AC = window.APP_CONFIG || {};
const SUPABASE_URL = AC.url || "PASTE_PROJECT_URL";
const SUPABASE_ANON_KEY = (AC.key && !AC.key.includes('PASTE')) ? AC.key : "PASTE_ANON_KEY";
const PAY_INFO = AC.payInfo || "حوّل المبلغ على رقم: 01XXXXXXXXX ثم اكتب رقم العملية.";
const SUPPORT = AC.support || "@YourSupportBot";
/* ============================== */

const $ = s => document.querySelector(s), app = $('#app');
const on = (s, f) => { const e = $(s); if (e) e.onclick = f };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toEn = s => String(s).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\s+/g, '');
const ST = {pending:'قيد المراجعة', approved:'تمت الموافقة', rejected:'مرفوض'};
let sb, me, view, qs = [], i = 0, saved = new Set(), answered = {}, fromSaved = false, savedLec = null;
let subs = [], meta = [], metaFor = null, curYear = 0, curBlock = null, curSub = null, curLec = null;
let retry = new Set(), reviewing = false;

// ==MINI-CLIENT-START==
function makeClient(url, key) {
  let sess = null;
  try { sess = JSON.parse(ls.get('sbsess') || 'null') } catch (e) {}
  const save = s => {
    if (s && !s.expires_at) s.expires_at = Math.floor(Date.now() / 1000) + (s.expires_in || 3600);
    sess = s;
    try { s ? ls.set('sbsess', JSON.stringify(s)) : ls.del('sbsess') } catch (e) {}
  };
  const read = async r => {
    const t = await r.text(); let j = null;
    try { j = t ? JSON.parse(t) : null } catch (e) {}
    if (!r.ok) return { data: null, error: { message: (j && (j.message || j.msg || j.error_description || j.error)) || r.statusText, status: r.status } };
    return { data: j, error: null };
  };
  const ensure = async () => {
    if (!sess || !sess.refresh_token || sess.expires_at - 60 > Date.now() / 1000) return;
    const r = await fetch(url + '/auth/v1/token?grant_type=refresh_token', { method: 'POST', headers: { apikey: key, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: sess.refresh_token }) });
    save(r.ok ? await r.json() : null);
  };
  const headers = extra => {
    const h = Object.assign({ apikey: key, 'Content-Type': 'application/json' }, extra);
    if (sess) h.Authorization = 'Bearer ' + sess.access_token;
    return h;
  };
  const call = async (path, opt) => { await ensure(); return read(await fetch(url + path, opt)) };

  class Q {
    constructor(t) { this.t = t; this.p = new URLSearchParams(); this.o = []; this.m = 'GET'; this.b = null; this.one = false }
    select(c = '*') { this.p.set('select', c); return this }
    insert(b) { this.m = 'POST'; this.b = b; return this }
    delete() { this.m = 'DELETE'; return this }
    eq(c, v) { this.p.append(c, 'eq.' + v); return this }
    order(c, o = {}) { this.o.push(c + (o.ascending === false ? '.desc' : '.asc')); return this }
    limit(n) { this.p.set('limit', n); return this }
    offset(n) { this.p.set('offset', n); return this }
    inList(c, arr) { this.p.append(c, 'in.(' + arr.join(',') + ')'); return this }
    is(c, v) { this.p.append(c, 'is.' + v); return this }
    single() { this.one = true; return this }
    then(a, b) {
      if (this.o.length) this.p.set('order', this.o.join(','));
      const extra = {};
      if (this.one) extra.Accept = 'application/vnd.pgrst.object+json';
      if (this.m !== 'GET') extra.Prefer = 'return=minimal';
      const qs = this.p.toString().replace(/\+/g, '%20');
      return call('/rest/v1/' + this.t + (qs ? '?' + qs : ''), { method: this.m, headers: headers(extra), body: this.b ? JSON.stringify(this.b) : undefined }).then(a, b);
    }
  }
  return {
    from: t => new Q(t),
    fn: async (n, body) => { await ensure(); return read(await fetch(url + '/functions/v1/' + n, { method: 'POST', headers: headers(), body: JSON.stringify(body || {}) })) },
    rpc: (n, args) => call('/rest/v1/rpc/' + n, { method: 'POST', headers: headers(), body: JSON.stringify(args || {}) }),
    auth: {
      getSession: async () => { await ensure(); return { data: { session: sess } } },
      signInWithPassword: async ({ email, password }) => {
        const r = await read(await fetch(url + '/auth/v1/token?grant_type=password', { method: 'POST', headers: { apikey: key, 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) }));
        if (r.error) return { data: null, error: r.error };
        save(r.data); return { data: r.data, error: null };
      },
      signOut: async () => {
        try { if (sess) await fetch(url + '/auth/v1/logout', { method: 'POST', headers: headers() }) } catch (e) {}
        save(null); return { error: null };
      }
    }
  };
}

  let all = [], from = 0;
  for (;;) {
    const {data, error} = await mk().limit(1000).offset(from);
    if (error) return {data: null, error};
    all = all.concat(data || []);
    if (!data || data.length < 1000) return {data: all, error: null};
    from += 1000;
  }
}

async function fetchByIds(ids) {
  let all = [];
  for (let k = 0; k < ids.length; k += 200) {
    const {data, error} = await sb.from('questions').select('id,type,body,choices,chapter,source_tag,is_key_point').inList('id', ids.slice(k, k + 200)).order('id');
    if (error) return {data: null, error};
    all = all.concat(data || []);
  }
  all.sort((a, b) => a.id - b.id);
  return {data: all, error: null};
}

function icon(name) {
  const n = String(name || '').toLowerCase();
  const k = /anat/.test(n) ? 'anat' : /embry/.test(n) ? 'embry' : /physio/.test(n) ? 'physio' : /histo/.test(n) ? 'histo' :
    /biochem/.test(n) ? 'biochem' : /terminolog/.test(n) ? 'termin' : /^cns$|neuro/.test(n.trim()) ? 'cns' : /renal/.test(n) ? 'renal' : /^resp/.test(n.trim()) ? 'resp' : '';
  return k ? '<span class="ic">' + ICONS[k] + '</span>' : '';
}

// 2) blocks of a year
function blocksView(y) {
  view = 'blocks'; curYear = y; curBlock = null; curSub = null; curLec = null;
  const list = subs.filter(x => x.year === y);
  const blocks = [...new Set(list.map(x => x.block))].sort((a, b) => {
    const o = BLOCK_ORDER[y] || [], ia = o.indexOf(a), ib = o.indexOf(b);
    return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib) || a.localeCompare(b);
  });
  let html = topBar() + (me.is_admin ? BK('‹ الفرق') : '') + crumb() + '<h2>' + yName(y) + ' - اختار البلوك</h2>';
  if (!blocks.length) html += '<p>لسه مفيش مواد</p>';
  blocks.forEach((b, n) => {
    const c = list.filter(x => x.block === b).length;
    html += '<button class="sub blk" data-n="' + n + '">' + icon(b) + '<b>' + esc(b) + '</b>' + (c > 1 ? '<br><small>' + c + ' مادة</small>' : '') + '</button>';
  });
  app.innerHTML = html; bindTop(); on('#bk', () => homeView());
  document.querySelectorAll('.blk').forEach(btn => btn.onclick = () => {
    const b = blocks[+btn.dataset.n], only = list.filter(x => x.block === b);
    if (only.length === 1) { curBlock = b; lecturesView(only[0]) } else subjectsView(y, b);
  });
}

// ترتيب الإجابة النموذجية: كل نقطة في سطر لوحدها
function fmtModel(t) {
  if (!t) return 'مفيش إجابة نموذجية';
  let s = String(t).replace(/\r/g, '').trim();
  s = s.replace(/([.:;!?\)\]])[ \t]+(?=(?:\d{1,2}[\)\.]|[A-Za-z]\))[ \t])/g, '$1\n');
  s = s.replace(/([^\n])[ \t]+(?=•[ \t])/g, '$1\n');
  s = s.replace(/([.:;])[ \t]+(?=[-–][ \t])/g, '$1\n');
  return s.split(/\n+/).map(l => l.trim()).filter(Boolean).map(l =>
    '<div class="ml' + (/^(\d{1,2}[\)\.]|[A-Za-z]\)|[-•–])\s/.test(l) ? ' pt' : '') + '">' + esc(l) + '</div>').join('');
}

// 6) load the chosen section and start the quiz
async function startQuiz(f) {
  loading();
  const scope = curLec === LEC_ALL ? meta : meta.filter(q => chOf(q) === curLec);
  let res;
  if (f.wrong) {
    const ids = scope.filter(isWrong).map(q => q.id);
    retry = new Set(ids);
    res = await fetchByIds(ids);
  } else {
    retry = new Set();
    res = await fetchAll(() => {
      let q = sb.from('questions').select('id,type,body,choices,chapter,source_tag,is_key_point').eq('subject_id', curSub.id);
      if (curLec !== LEC_ALL) q = curLec ? q.eq('chapter', curLec) : q.is('chapter', 'null');
      if (f.key) q = q.eq('is_key_point', 'true');
      if (f.src) q = q.eq('source_tag', f.src);
      if (f.type) q = q.eq('type', f.type);
      return q.order('id');
    });
  }
  if (res.error) { alert('لازم حسابك يكون مفعّل ومدفوع النهاردة'); return sectionsView() }
  qs = res.data; reviewing = !!f.wrong; fromSaved = false;
  const first = qs.findIndex(x => !answered[x.id]);
  i = (f.wrong || first < 0) ? 0 : first;
  quizView();
}

function go(d) { i = Math.max(0, Math.min(qs.length - 1, i + d)); quizView() }

function quizView() {
  view = 'quiz'; const q = qs[i];
  if (!q) {
    app.innerHTML = topBar() + BK('‹ رجوع') + '<div class="card">مفيش أسئلة في المادة دي لسه</div>';
    bindTop(); on('#bk', () => sectionsView()); return;
  }
  const a = retry.has(q.id) ? null : answered[q.id];
  app.innerHTML = topBar() + `<div class="bar"><button class="back" id="bk">‹ رجوع</button><span>${i + 1} / ${qs.length}</span><button class="svb" id="st">${saved.has(q.id) ? '★ محفوظ' : '☆ حفظ'}</button></div>
    <div class="card"><small>${reviewing ? '❌ مراجعة الأخطاء · ' : ''}${q.is_key_point ? '⭐ ' : ''}${esc(q.chapter || '')} ${q.source_tag ? '· ' + esc(q.source_tag) : ''}</small>
    <p class="q" dir="auto">${esc(q.body)}</p><div id="ans"></div></div>
    <div class="row"><button id="pv">السابق</button><button id="nx">التالي</button></div>`;
  bindTop(); on('#bk', () => fromSaved ? savedTypes() : sectionsView()); on('#pv', () => go(-1)); on('#nx', () => go(1));
  on('#st', async () => {
    if (saved.has(q.id)) { await sb.from('bookmarks').delete().eq('question_id', q.id); saved.delete(q.id) }
    else { await sb.from('bookmarks').insert({user_id: me.id, question_id: q.id}); saved.add(q.id) }
    $('#st').textContent = saved.has(q.id) ? '★ محفوظ' : '☆ حفظ';
  });
  const box = $('#ans');
  if (q.type === 'mcq') {
    box.innerHTML = (q.choices || []).map((c, k) => `<button class="ch" data-k="${k}" dir="auto"><b>${'ABCDE'[k]}.</b> ${esc(c)}</button>`).join('');
    const mark = (k, cor) => document.querySelectorAll('.ch').forEach(b => {
      const n = +b.dataset.k; b.disabled = true;
      if (n === cor) b.classList.add('ok'); else if (n === k) b.classList.add('bad');
    });
    if (a) mark(a.chosen_index, a.is_correct ? a.chosen_index : -1);
    if (a && !a.is_correct) sb.rpc('get_answer_key', {qid: q.id}).then(r => { if (!r.error && r.data && qs[i] === q) mark(a.chosen_index, r.data.correct_index) });
    document.querySelectorAll('.ch').forEach(b => b.onclick = async () => {
      if (answered[q.id] && !retry.has(q.id)) return;
      const k = +b.dataset.k, {data, error} = await sb.rpc('submit_answer', {qid: q.id, idx: k});
      if (error) return alert('لازم حسابك يكون مفعّل ومدفوع النهاردة');
      answered[q.id] = {chosen_index: k, is_correct: data.is_correct}; retry.delete(q.id);
      mark(k, data.correct_index);
    });
  } else {
    box.innerHTML = '<textarea id="wa" rows="4" placeholder="اكتب إجابتك هنا..."></textarea><button class="btn" id="rv" style="background:#2a1616">إظهار الإجابة النموذجية</button><div id="mo" class="card" style="display:none" dir="auto"></div>';
    on('#rv', async () => {
      const {data, error} = await sb.rpc('reveal_model_answer', {qid: q.id});
      if (error) return alert('لازم حسابك يكون مفعّل ومدفوع النهاردة');
      $('#mo').style.display = 'block'; $('#mo').innerHTML = fmtModel(data);
    });
  }
}

// ===== حماية المحتوى (ردع: مفيش طريقة تمنع تصوير الشاشة 100% من المتصفح) =====
function setWM(off) {
  let w = document.getElementById('wm');
  if (off || !me) { if (w) w.remove(); return }
  if (!w) { w = document.createElement('div'); w.id = 'wm'; document.body.appendChild(w) }
  const t = esc((me.phone || me.name || '') + '');
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="280" height="170"><text x="20" y="100" transform="rotate(-24 140 85)" fill="rgba(255,255,255,0.13)" font-size="17" font-family="Arial">' + t + '</text></svg>';
  w.style.backgroundImage = 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")';
}
(function () {
  let t;
  const hide = ms => { document.body.classList.add('hid'); clearTimeout(t); if (ms) t = setTimeout(show, ms) };
  const show = () => { if (!document.hidden) document.body.classList.remove('hid') };
  const typing = e => e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
  document.addEventListener('visibilitychange', () => document.hidden ? hide() : show());
  window.addEventListener('focus', show);
  window.addEventListener('pageshow', show);
  document.addEventListener('keydown', e => {
    const k = (e.key || '').toLowerCase();
    if (k === 'printscreen' || k === 'meta' && e.shiftKey || (e.metaKey && e.shiftKey && /[345]/.test(k))) {
      hide(2500); try { navigator.clipboard.writeText('') } catch (x) {}
    }
    if ((e.ctrlKey || e.metaKey) && ['p', 's', 'u'].includes(k) || (e.ctrlKey || e.metaKey) && e.shiftKey && ['s', 'i', 'c', 'j'].includes(k) || k === 'f12') e.preventDefault();
  }, true);
  document.addEventListener('keyup', e => { if ((e.key || '').toLowerCase() === 'printscreen') { hide(2500); try { navigator.clipboard.writeText('') } catch (x) {} } }, true);
  ['contextmenu', 'copy', 'cut', 'dragstart', 'selectstart'].forEach(ev => document.addEventListener(ev, e => { if (!typing(e)) e.preventDefault() }, true));
  window.addEventListener('beforeprint', () => hide());
  // جهاز واحد بس: كل 25 ثانية نتأكد إن الجلسة لسه هي الفعّالة
  setInterval(async () => {
    if (!me || me.is_admin || view === 'auth' || view === 'blocked' || document.hidden) return;
    const {data: r} = await sb.rpc('my_access');
    if (r && !r.ok && r.reason === 'other_device') blockedView('other_device');
  }, 25000);
})();
</script>
