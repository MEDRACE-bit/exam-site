<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MEDRACE</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
body{margin:0;background:#140a0a;color:#f4eaea;font:16px Cairo,system-ui,sans-serif}
.brand{max-width:560px;margin:0 auto;padding:10px 12px 0;display:flex;align-items:center;direction:ltr;gap:12px}.brand img{width:52px;height:52px;border-radius:12px;display:block;flex:none}.brand b{flex:1;text-align:center;font-size:1.35em;font-weight:900;letter-spacing:1px;padding-right:52px}
#app{max-width:560px;margin:auto;padding:12px}
.card{background:#241212;border:1px solid #3a1c1c;border-radius:14px;padding:16px;margin:10px 0}
input,textarea,select{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #3a1c1c;background:#1b0d0d;color:inherit;font:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.btn{width:100%;padding:12px;border:0;border-radius:10px;background:#c0262d;font-weight:700;margin-top:6px}
.btn:disabled{opacity:.5}
.ic{display:inline-block;width:50px;height:50px;vertical-align:middle;margin-inline-end:10px}.ic svg,.ic img{width:100%;height:100%;display:block;object-fit:contain}
.btn.ok{background:#1f7a3d}.btn.no{background:#555}
.link{background:none;border:0;color:#e88;padding:6px}.link.rbox{display:block;margin:12px auto 0;padding:9px 22px;border:1.5px solid #e88;border-radius:14px}.rrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}.rrow .rbox{margin:0}.pay-info a,.blk a{color:#ffd54a;font-weight:700;text-decoration:underline}
.back{display:inline-flex;align-items:center;gap:6px;background:#2a1414;border:1px solid #c0262d;color:#ffd0d0;border-radius:14px;padding:8px 18px;margin:8px 0;font:inherit;font-weight:700;cursor:pointer}.back:active{background:#3a1c1c}.bar .back{margin:0}
.pill{background:#3a1c1c;border:0;border-radius:20px;padding:6px 12px}
.qrrow{display:flex;justify-content:flex-end;margin:6px 0}
.qrb{background:linear-gradient(135deg,#0b5a5a,#12304f);border:1.5px solid #19a3a3;color:#e6fbff;border-radius:14px;padding:7px 14px;font:inherit;font-weight:700;font-size:.9em;cursor:pointer;direction:ltr}
.qp{position:relative;width:100%;container-type:inline-size;border-radius:14px;overflow:hidden;background:#fff;margin:8px 0}
.qp>img{width:100%;display:block;user-select:none;-webkit-user-drag:none}
.qph{position:absolute;overflow:hidden;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:9cqw;background:radial-gradient(circle,#16405c,#0a1a2c)}
.qph img{width:100%;height:100%;object-fit:cover}
.qpl{position:absolute;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:clamp(8px,2.4cqw,22px);padding:0 1.2cqw}
.qpl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.qrt{text-align:center;font-weight:700;color:#8fe0e0;margin:4px 0}
.qrl{font-size:1.05em}
.qre{border-top:1px solid #3a1c1c;margin-top:10px;padding-top:8px}
.qpv{width:70px;height:70px;border-radius:50%;object-fit:cover;margin-top:6px;display:block}.qpv[hidden]{display:none}
.tbar{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;background:#102b17;border:1px solid #1f6b36;color:#8be6a5;border-radius:10px;padding:8px 12px;margin:8px 0;font-size:.95em}.tbar b{font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}.tbar.lock{background:#2b1010;border-color:#7a2323;color:#ffb3b3}.tbar .btn{margin:0;width:auto;padding:8px 14px}.sub.locked{opacity:.6;cursor:pointer}
.lkm{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px}.lkc{max-width:340px;width:100%;text-align:center}.lkc .btn{width:100%;margin:8px 0}
.note{background:#10202b;border:1px solid #1f5f7a;color:#a8dcf5;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:.92em;line-height:1.7}.note a{color:#ffd54a;font-weight:700;text-decoration:underline}
.rate{background:#2b2410;border:1px solid #6b5410;color:#ffd54a;border-radius:10px;padding:8px 12px;margin:8px 0;font-size:.9em;text-align:center}
.coin{display:inline-block;width:1.15em;height:1.15em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe98a,#f2b900 60%,#b98300);border:2px solid #ffd54a;box-shadow:inset 0 0 0 2px #c99400;vertical-align:-.2em;margin-left:4px;position:relative}
.coin:after{content:'C';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 .7em/1 Arial,sans-serif;color:#7a5200}
.top,.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sub,.ch{display:block;width:100%;text-align:start;padding:14px;margin:8px 0;border-radius:12px;border:1px solid #3a1c1c;background:#241212}
.ch{background:#1b0d0d;padding:12px;margin:6px 0}
.ch.ok{border-color:#2e9e5b;background:#12301f}
.ch.bad{border-color:#d64545;background:#3a1414}
.row{display:flex;gap:6px;margin:6px 0}
.row button{flex:1;padding:10px;border-radius:10px;border:1px solid #3a1c1c;background:#1b0d0d}
.row .on{background:#c0262d;border-color:#c0262d}
.cprow{display:flex;gap:8px;align-items:center}.cprow input{margin:6px 0;text-align:center;font-weight:700;letter-spacing:1px;direction:ltr}.cprow .btn{width:auto;margin:0;padding:12px 18px;white-space:nowrap}.lbl{display:block;margin-top:10px;font-size:.92em;opacity:.85}
.msg{color:#e88;min-height:1.2em}
.q{font-size:18px;line-height:1.7}
.ml{margin:6px 0;line-height:1.8}.ml.pt{margin-inline-start:6px}.svb{color:#fff;background:#241212;border:1px solid #c0262d;border-radius:10px;padding:8px 12px}.svh{margin:14px 0 4px;color:#e88;font-weight:700}.svs{margin:8px 0 2px;color:#aaa;font-size:13px}.sqi{display:block;width:100%;text-align:start;padding:10px 12px;margin:5px 0;border-radius:10px;border:1px solid #3a1c1c;background:#1b0d0d;line-height:1.6}
.pb{height:4px;background:#3a1c1c;border-radius:4px;margin-top:8px}
.pb i{display:block;height:100%;background:#c0262d;border-radius:4px}
.crumb{color:#a88;font-size:13px;margin:8px 0}
.lrow{display:flex;gap:8px;align-items:stretch}.lrow .sub{flex:1;width:auto}
.sub.mine{border-color:#c0262d}
.pz-top{display:flex;justify-content:space-between;font-size:14px;color:#a88;margin:6px 0}
#pz-wrap{position:relative;border-radius:10px;overflow:hidden;background:#fff;margin-top:8px;min-height:120px}
#pz-im{width:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.pz-m{position:absolute;border:0;border-radius:4px;background:#ffe066;padding:0;cursor:pointer}
.pz-m.on{outline:3px solid #c0262d;animation:pzp 1s infinite}
.pz-m.rev{background:transparent;outline:3px solid #c0262d}
@keyframes pzp{50%{outline-color:transparent}}
#pz-panel{position:fixed;left:0;right:0;bottom:0;background:#150a0a;border-top:1.5px solid #3a1c1c;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
#pz-panel{display:flex;gap:8px;justify-content:center}#pz-prev{padding:13px 16px;border-radius:12px;border:1px solid #c0262d;background:#241212;color:#fff;font:inherit;font-weight:700}#pz-prev:disabled{opacity:.35}#pz-sv{padding:13px 12px;border-radius:12px;border:1px solid #c0262d;background:#241212;color:#fff;font:inherit;font-weight:700}#pz-btn{display:block;flex:1;max-width:620px;margin:0;padding:13px;border-radius:12px;border:0;background:#c0262d;color:#fff;font:inherit;font-size:17px;font-weight:700}

.sub.prac{background:#0c2a33;border-color:#1aa3c4;color:#e6fbff;text-align:center}.sub.prac small{color:#8fd8e8}.sub.prac.soon{opacity:.4;filter:grayscale(1);cursor:not-allowed}
.lr3 .blk{flex:2;min-width:0}.lr3 .stb,.lr3 .prac,.lr3 .lsp{flex:1;min-width:0}.lr3 .sub.stb,.lr3 .sub.prac{padding:12px 3px;text-align:center;font-size:.82em;display:flex;flex-direction:column;justify-content:center;word-break:break-word}.lsp{margin:8px 0}
.lr3 .sub.prac b{font-size:.74em;letter-spacing:-.2px}.lr3 .sub.prac small{font-size:.7em}
.sub.stb{background:#2a2108;border-color:#e0a526;color:#fff2cf}.sub.stb small{color:#f0cf7a}
.ch.sel{border-color:#e0a526;background:#2a2108}
.stc{display:flex;gap:10px;align-items:center;padding:10px 12px;margin:5px 0;border-radius:10px;border:1px solid #3a1c1c;background:#1b0d0d}.stc input{width:18px;height:18px;margin:0;padding:0;flex:none;accent-color:#c0262d}.stc small{margin-inline-start:auto;opacity:.75;white-space:nowrap}.stc.off{opacity:.4}.stsh{margin:12px 2px 2px;font-weight:700;opacity:.85}
.stg{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}.stg button{width:34px;height:34px;padding:0;border-radius:8px;border:1px solid #3a1c1c;background:#1b0d0d;font-size:.85em}.stg .dn{background:#2a2108;border-color:#e0a526}.stg .cu{outline:2px solid #fff}
.stH{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px;margin:6px 0;border-radius:10px;border:1px solid #3a1c1c;background:#1b0d0d}.stH .btn{width:auto;margin:0;padding:8px 14px}.stl{font-weight:700}.buyblk{margin:-2px 0 12px;padding:8px 12px;font-size:.92em}.adminp{margin:-4px 0 12px;text-align:center;opacity:.75}.authnote{margin:10px 0 14px;padding:10px 12px;border:1px solid #c0262d;border-radius:10px;background:rgba(192,38,45,.12);font-size:.92em;line-height:1.8}.stx{width:auto;margin:0;padding:2px 10px;background:none;border:0;color:#e88;font-size:1.2em}
h3{margin:16px 0 4px;color:#e88}

.soonmsg{text-align:center;font-weight:700;font-size:1.2rem;padding:10px;margin:8px 0;border:1px dashed #c0262d;border-radius:12px;color:#ffb3b6}
.row button.soon{opacity:.4;filter:grayscale(1);cursor:not-allowed;background:#1b0d0d}.row button.soon small{color:#e88}
.sub30{margin:12px 0;padding:12px;border:1px solid #c0262d;border-radius:12px;background:#1b0d0d;line-height:1.8}
.sub30 .btn{margin-top:8px}
.sub30.f7{border-color:#1f6b36;background:#0e1f13}.tbar.f7b{background:#0e1f13;border-color:#1f6b36}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
img{-webkit-user-drag:none;pointer-events:none}
#wm{position:fixed;inset:0;z-index:99999;pointer-events:none}
body.hid #app{filter:blur(40px);pointer-events:none}
body.hid::after{content:'🔒 المحتوى محمي';position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0d0606;color:#fff;font-size:20px;z-index:100000}
@media print{body{display:none!important}}
.stk-w{margin-inline-start:auto;display:flex;gap:6px;flex:none}.stk{width:auto;margin:0;padding:5px 10px;border-radius:8px;border:1px solid #3a1c1c;background:#1b0d0d;color:#fff;font-size:.8em}.stk.on{background:#c0262d;border-color:#ff5a5a}.stk:disabled{opacity:.35;cursor:default}
</style>
</head>

function accMsg(e) {

  return 'لازم حسابك يكون مفعّل ومدفوع النهاردة';

// ==MINI-CLIENT-START==
function makeClient(url, key) {
  let sess = null;
  try { sess = JSON.parse(ls.get('sbsess') || 'null') } catch (e) {}
  const save = s => {
    if (s && !s.expires_at) s.expires_at = Math.floor(Date.now() / 1000) + (s.expires_in || 3600);
    sess = s;
    try { s ? ls.set('sbsess', JSON.stringify(s)) : ls.del('sbsess') } catch (e) {}
  };
  const read = async r => {
    const t = await r.text(); let j = null;
    try { j = t ? JSON.parse(t) : null } catch (e) {}
    if (!r.ok) return { data: null, error: { message: (j && (j.message || j.msg || j.error_description || j.error)) || r.statusText, status: r.status } };
    return { data: j, error: null };
  };
  let refreshing = null;
  const ensure = async () => {
    if (!sess || !sess.refresh_token || sess.expires_at - 60 > Date.now() / 1000) return;
    if (!refreshing) refreshing = (async () => {
      try {
        const r = await fetch(url + '/auth/v1/token?grant_type=refresh_token', { method: 'POST', headers: { apikey: key, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: sess.refresh_token }) });
        if (r.ok) save(await r.json());
        else if (r.status === 400 || r.status === 401) { await new Promise(z => setTimeout(z, 700)); try { const cur = JSON.parse(ls.get('sbsess') || 'null'); if (cur && cur.expires_at - 60 > Date.now() / 1000) sess = cur; else save(null) } catch (e) { save(null) } }
      } catch (e) { /* network blip: keep the session, try again on the next call */ }
      finally { refreshing = null }
    })();
    await refreshing;
  };
  const headers = extra => {
    const h = Object.assign({ apikey: key, 'Content-Type': 'application/json' }, extra);
    if (sess) h.Authorization = 'Bearer ' + sess.access_token;
    return h;
  };
  const call = async (path, opt) => {
    await ensure();
    const go = async () => {
      try {
        const ex = {}, oh = (opt && opt.headers) || {};
        ['Prefer', 'Accept', 'Content-Profile'].forEach(k => { if (oh[k]) ex[k] = oh[k] });
        return await read(await fetch(url + path, Object.assign({}, opt, { headers: headers(ex) })));
      } catch (e) { return { data: null, error: { message: 'network', status: 0 } } }
    };
    let r = await go();
    if (r.error && (r.error.status === 0 || r.error.status === 401)) { await new Promise(z => setTimeout(z, 600)); if (r.error.status === 401 && sess) { sess.expires_at = 0; await ensure() } r = await go() }
    return r;
  };

  class Q {
    constructor(t) { this.t = t; this.p = new URLSearchParams(); this.o = []; this.m = 'GET'; this.b = null; this.one = false }
    select(c = '*') { this.p.set('select', c); return this }
    insert(b) { this.m = 'POST'; this.b = b; return this }
    delete() { this.m = 'DELETE'; return this }
    eq(c, v) { this.p.append(c, 'eq.' + v); return this }
    order(c, o = {}) { this.o.push(c + (o.ascending === false ? '.desc' : '.asc')); return this }
    limit(n) { this.p.set('limit', n); return this }
    offset(n) { this.p.set('offset', n); return this }
    inList(c, arr) { this.p.append(c, 'in.(' + arr.join(',') + ')'); return this }
    is(c, v) { this.p.append(c, 'is.' + v); return this }
    single() { this.one = true; return this }
    then(a, b) {
      if (this.o.length) this.p.set('order', this.o.join(','));
      const extra = {};
      if (this.one) extra.Accept = 'application/vnd.pgrst.object+json';
      if (this.m !== 'GET') extra.Prefer = 'return=minimal';
      const qs = this.p.toString().replace(/\+/g, '%20');
      return call('/rest/v1/' + this.t + (qs ? '?' + qs : ''), { method: this.m, headers: headers(extra), body: this.b ? JSON.stringify(this.b) : undefined }).then(a, b);
    }
  }
  return {
    from: t => new Q(t),
    fn: async (n, body) => { await ensure(); return read(await fetch(url + '/functions/v1/' + n, { method: 'POST', headers: headers(), body: JSON.stringify(body || {}) })) },
    rpc: (n, args) => call('/rest/v1/rpc/' + n, { method: 'POST', headers: headers(), body: JSON.stringify(args || {}) }),
    auth: {
      getSession: async () => { await ensure(); return { data: { session: sess } } },
      signInWithPassword: async ({ email, password }) => {
        const r = await read(await fetch(url + '/auth/v1/token?grant_type=password', { method: 'POST', headers: { apikey: key, 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) }));
        if (r.error) return { data: null, error: r.error };
        save(r.data); return { data: r.data, error: null };
      },
      signOut: async () => {
        try { if (sess) await fetch(url + '/auth/v1/logout', { method: 'POST', headers: headers() }) } catch (e) {}
        save(null); return { error: null };
      }
    }
  };
}

function icon(name) {
  const n = String(name || '').toLowerCase();
  const k = /anat/.test(n) ? 'anat' : /embry/.test(n) ? 'embry' : /physio/.test(n) ? 'physio' : /histo/.test(n) ? 'histo' :
    /biochem/.test(n) ? 'biochem' : /terminolog/.test(n) ? 'termin' : /^micro/.test(n.trim()) ? 'micro' : /^cns$|neuro/.test(n.trim()) ? 'cns' : /renal/.test(n) ? 'renal' : /^resp/.test(n.trim()) ? 'resp' : /patho/.test(n) ? 'patho' : '';
  return k ? '<span class="ic">' + ICONS[k] + '</span>' : '';
}

// 2) blocks of a year
function blocksView(y) {
  pracMode = false; view = 'blocks'; curYear = y; curBlock = null; curSub = null; curLec = null;
  const list = subs.filter(x => x.year === y);
  const blocks = [...new Set(list.map(x => x.block))].sort((a, b) => {
    const o = BLOCK_ORDER[y] || [], ia = o.indexOf(a), ib = o.indexOf(b);
    return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib) || a.localeCompare(b);
  });
  let html = topBar() + qrBtn() + (me.is_admin ? BK('‹ الفرق') : '') + crumb() + '<h2>' + yName(y) + ' - اختار البلوك</h2>';
  if (!blocks.length) html += '<p>لسه مفيش مواد</p>';
  blocks.forEach((b, n) => {
    const c = list.filter(x => x.block === b).length;
    const own = blockShop.owned.has(bkKey(y, b)), pr = blockPrice(y, b);
    const bt = '<button class="sub blk" data-n="' + n + '">' + icon(b) + '<b>' + esc(b) + '</b>' + (c > 1 ? '<br><small>' + c + ' مادة</small>' : '') + (own ? '<br><small>✅ مفتوح</small>' : passOn(y, b) ? '<br><small>⏳ مفتوح 24 ساعة</small>' : '') + '</button>';
    const buy = me.is_admin
      ? '<div class="adminp"><small>👑 أدمن: ' + (pr !== null ? '🛒 سعر البلوك للطلاب ' + pr + ' coin' : blockShop.err ? '⚠ خطأ في تحميل الأسعار: ' + esc(blockShop.err) : '⚠ مفيش سعر شراء متسجل للبلوك ده') + '</small></div>'
      : '';
    const pk = y === 1 ? (b === 'Anatomy' ? 'anat' : b === 'Terminology' ? null : 'soon') : 'soon';
    const stb = '<button class="sub stb" data-n="' + n + '"><b>اختبر نفسك</b><br><small>📝 اختبار</small></button>';
    const pb = pk === 'soon' ? '<button class="sub prac soon" disabled><b>PRACTICAL</b><br><small>قريباً</small></button>' : pk ? '<button class="sub prac" data-pk="' + pk + '"><b>PRACTICAL</b><br><small>' + (pk === 'bio' ? 'عملي البايوكيمستري' : PZ[pk].name) + '</small></button>' : '<span class="lsp"></span>';
    html += '<div class="lrow lr3">' + bt + stb + pb + '</div>' + buy;
  });
  app.innerHTML = html; bindTop(); on('#bk', () => homeView());
  document.querySelectorAll('.prac').forEach(pb => pb.onclick = () => { if (pb.dataset.pk === 'bio') { const sb1 = subs.find(x => x.year === 1 && x.block === 'Biochemistry'); if (!sb1) return alert('لسه مفيش عملي'); curBlock = 'Biochemistry'; pracMode = true; lecturesView(sb1) } else practicalView(pb.dataset.pk) });
  document.querySelectorAll('.stb').forEach(b => b.onclick = () => stHome(y, blocks[+b.dataset.n]));
    document.querySelectorAll('.blk').forEach(btn => btn.onclick = () => {
    const b = blocks[+btn.dataset.n], only = list.filter(x => x.block === b);
    const open = () => { if (only.length === 1) { curBlock = b; lecturesView(only[0]) } else subjectsView(y, b) };
    if (!me.is_admin && blockPrice(y, b) !== null && !canBlock(y, b)) return lockedPrompt(y, b, open, FREE_FIRST_YEARS.includes(y) ? open : null);
    open();
  });
}


// ====== اختبر نفسك: اختبار عشوائي من أسئلة البلوك (30 ثانية للسؤال) ======
const ST_SEC = 30;
const stKey = () => 'selftest_' + (me ? me.id : '');
const stLoad = () => { try { const a = JSON.parse(ls.get(stKey()) || '[]'); return Array.isArray(a) ? a : [] } catch (e) { return [] } };
const stSaveAll = a => { a = a.slice(0, 80); let t = JSON.stringify(a); while (t.length > 3500000 && a.length > 1) { a.pop(); t = JSON.stringify(a) } ls.set(stKey(), t) };
const stShuf = a => { for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]] } return a };
const stDur = s => { s = Math.round(s); const m = Math.floor(s / 60), r = s % 60; return m ? m + ' دقيقة' + (r ? ' و' + r + ' ثانية' : '') : r + ' ثانية' };
const stClock = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') };
const stDate = t => { const d = new Date(t); return d.toLocaleDateString('ar-EG') + ' ' + d.toLocaleTimeString('ar-EG', {hour: '2-digit', minute: '2-digit'}) };
let stTimer = null, stEx = null, stCfg = {}, stBm = new Set(), stBack = null;
const stStop = () => { if (stTimer) { clearInterval(stTimer); stTimer = null } };

async function stHome(y, block) {
  if (!canBlock(y, block)) return lockedPrompt(y, block, () => stHome(y, block));
  stStop(); stEx = null;
  view = 'selftest'; curYear = y; curBlock = block; curSub = null; curLec = null;
  loading();
  const bsubs = subs.filter(x => x.year === y && x.block === block), ids = bsubs.map(x => x.id);
  const [m, a, fr, fi] = await Promise.all([
    fetchAll(() => sb.from('questions').select('id,chapter,is_key_point,subject_id').eq('type', 'mcq').inList('subject_id', ids).order('id')),
    fetchAll(() => sb.from('attempts').select('question_id,chosen_index,is_correct').order('question_id')),
    fetchFolders(c => sb.from('saved_folders').select(c).inList('subject_id', ids).order('id')),
    fetchAll(() => sb.from('saved_folder_items').select('folder_id,question_id').order('folder_id').order('question_id'))
  ]);
  if (m.error) { alert(accMsg(m.error)); return blocksView(y) }
  const bmr = await fetchAll(() => sb.from('bookmarks').select('question_id').order('question_id'));
  const sv = new Set((bmr.data || []).map(x => x.question_id)); stBm = sv;
  const att = {}; (a.data || []).forEach(x => { att[x.question_id] = x });
  const chs = {};
  (m.data || []).forEach(q => { const c = chOf(q); if (isPrac(c)) return; const k = q.subject_id + '||' + c; (chs[k] = chs[k] || {k, sid: q.subject_id, name: c, qs: []}).qs.push(q) });

  const list = Object.values(chs).sort((p, q) => sName(p.sid).localeCompare(sName(q.sid), 'ar') || p.name.localeCompare(q.name, 'ar', {numeric: true}));
  // أقسام الطالب (المحفوظات): بناخد منها أسئلة الاختياري اللي في البلوك ده بس
  const fMap = {}; (fi.data || []).forEach(x => { (fMap[x.folder_id] = fMap[x.folder_id] || new Set()).add(x.question_id) });
  const okQ = (m.data || []).filter(q => !isPrac(chOf(q)));
  const myF = (fr.error ? [] : (fr.data || [])).map(f => {
    const fq = okQ.filter(q => fMap[f.id] && fMap[f.id].has(q.id));
    const lecs = Array.from(new Set(fq.map(q => lecName(chOf(q))))).sort((p, q) => p.localeCompare(q, 'ar', {numeric: true}));
    const cc = {}; fq.forEach(q => { const k = chOf(q); cc[k] = (cc[k] || 0) + 1 });
    const dom = Object.keys(cc).sort((p, q) => cc[q] - cc[p])[0] || '';
    const ch = f.chapter ? String(f.chapter).trim() : dom;   // لو القسم لسه مش مربوط بنفترض محاضرته من أسئلته
    return {id: String(f.id), name: f.name, sid: f.subject_id, qs: fq, ch, lab: ch ? lecName(ch) : (lecs.length ? lecs[0] + (lecs.length > 1 ? ' +' + (lecs.length - 1) : '') : '')};
  });
  stCfg = {mode: 'all', checked: new Set(), fchecked: new Set(), open: new Set(), n: 20};
  const keyQs = c => c.qs.filter(q => q.is_key_point);
  const savedQs = c => c.qs.filter(q => sv.has(q.id));
  const vis = () => stCfg.mode === 'saved' ? list.filter(c => savedQs(c).length) : list.filter(c => c.qs.length);
  const cnt = c => stCfg.mode === 'key' ? keyQs(c).length : stCfg.mode === 'saved' ? savedQs(c).length : c.qs.length;
  const selC = () => vis().filter(c => cnt(c));
  const selF = () => stCfg.mode === 'saved' ? myF.filter(f => f.qs.length) : [];
  const allOn = () => stCfg.checked.size === selC().length && stCfg.fchecked.size === selF().length;
  stCfg.checked = new Set(selC().map(c => c.k));
  const solved = c => c.qs.filter(q => att[q.id]).length;
  const pool = () => {
    if (stCfg.mode === 'saved') {
      const mp = new Map();
      list.filter(c => stCfg.checked.has(c.k)).flatMap(savedQs).forEach(q => mp.set(q.id, q));
      myF.filter(f => stCfg.fchecked.has(f.id)).forEach(f => f.qs.forEach(q => mp.set(q.id, q)));
      return Array.from(mp.values());
    }
    return list.filter(c => stCfg.checked.has(c.k)).flatMap(c => stCfg.mode === 'key' ? keyQs(c) : c.qs);
  };
  const setMode = md => {
    stCfg.mode = md; stCfg.fchecked = new Set(); stCfg.open = new Set();
    if (md === 'saved') {
      if (!selC().length && !myF.some(f => f.qs.length)) { stCfg.mode = 'all'; return alert('لسه محفظتش أي أسئلة في البلوك ده') }
      stCfg.fchecked = new Set(selF().map(f => f.id));
    } else if (md === 'key' && !list.some(c => keyQs(c).length)) { stCfg.mode = 'all'; return alert('مفيش أسئلة مهمة في البلوك ده') }
    stCfg.checked = new Set(selC().map(c => c.k)); render();
  };
  const timeTxt = () => { const n = Math.max(0, Math.min(stCfg.n, pool().length)); return '⏳ مدة الاختبار: <b>' + stDur(n * ST_SEC) + '</b> (' + n + ' × ' + ST_SEC + ' ثانية)' };
  const startExam = async n => {
    const p = stShuf(pool().slice()).slice(0, n);
    loading();
    const r = await fetchByIds(p.map(q => q.id));
    const qs2 = r.error ? [] : stShuf(r.data.filter(q => Array.isArray(q.choices) && q.choices.length));
    if (!qs2.length) { alert(r.error ? accMsg(r.error) : 'مفيش أسئلة متاحة'); return render() }
    stEx = {qs: qs2, ans: {}, pend: {}, i: 0, secs: qs2.length * ST_SEC, t0: Date.now(), y, block, att, saved: false};
    stEx.end = stEx.t0 + stEx.secs * 1000;
    stStop(); stTimer = setInterval(stTick, 1000); stExamView();
  };
  function render() {
    view = 'selftest';
    const av = pool().length; stCfg.n = Math.max(1, Math.min(stCfg.n, av || 1));
    let h = topBar() + BK('‹ البلوكات') + '<h2>📝 اختبر نفسك</h2><div class="crumb">' + esc(yName(y)) + ' › ' + esc(block) + '</div>';
    if (!list.length) h += '<p>لسه مفيش أسئلة اختيارية (MCQ) في البلوك ده</p>';

      h += '<div class="svh">اختار الأسئلة</div><div class="row" id="stmodes">' +
        [['all', 'كل الأسئلة'], ['key', '⭐ المهم'], ['saved', '🔖 المحفوظات']].map(([v, t]) => '<button type="button" class="stm' + (stCfg.mode === v ? ' on' : '') + '" data-m="' + v + '">' + t + '</button>').join('') + '</div>' +
        '<div class="svh">الأقسام <button type="button" class="link" id="sta" style="float:left;padding:0">' + (allOn() ? 'إلغاء الكل' : 'تحديد الكل') + '</button></div>';
      const chRow = (c, n) => {
        const k = cnt(c);
        return '<label class="stc' + (k ? '' : ' off') + '"><input type="checkbox" class="stcb" data-n="' + n + '"' + (stCfg.checked.has(c.k) ? ' checked' : '') + (k ? '' : ' disabled') + '><span>' + esc(lecName(c.name)) + '</span><small>' + (sm ? k + ' محفوظ' : stCfg.mode === 'key' ? k + ' مهم' : solved(c) + ' / ' + k + ' محلول') + '</small></label>';
      };
      const fRow = f => '<label class="stc' + (f.qs.length ? '' : ' off') + '"><input type="checkbox" class="stfb" data-f="' + f.id + '"' + (stCfg.fchecked.has(f.id) ? ' checked' : '') + (f.qs.length ? '' : ' disabled') + '><span>📁 ' + esc(f.lab || f.name) + (f.lab ? '<span style="display:block;font-size:.8em;opacity:.7">' + esc(f.name) + '</span>' : '') + '</span><small>' + f.qs.length + ' سؤال</small></label>';
      if (sm) {
        // المحفوظات: مادة مادة، وتحت كل مادة المحاضرة بسهم يفتح: المحفوظ العادي وبعده أقسام الطالب
        const fOf = c => myF.filter(f => f.sid === c.sid && f.ch === c.name);
        const fRow2 = f => '<label class="stc' + (f.qs.length ? '' : ' off') + '"><input type="checkbox" class="stfb" data-f="' + f.id + '"' + (stCfg.fchecked.has(f.id) ? ' checked' : '') + (f.qs.length ? '' : ' disabled') + '><span>📁 ' + esc(f.name) + '</span><small>' + f.qs.length + ' سؤال</small></label>';
        const rows = list.map((c, n) => ({c, n})).filter(r => savedQs(r.c).length || fOf(r.c).length);
        const lone = myF.filter(f => !list.some(c => c.sid === f.sid && c.name === f.ch));
        const sids = Array.from(new Set(rows.map(r => r.c.sid).concat(lone.map(f => f.sid)))).sort((p, q) => sName(p).localeCompare(sName(q), 'ar'));
        sids.forEach(sid => {
          h += '<div class="stsh">' + esc(sName(sid)) + '</div>';
          rows.filter(r => r.c.sid === sid).forEach(({c, n}) => {

            fs.filter(f => f.qs.length).forEach(f => { tot.push(1); if (stCfg.fchecked.has(f.id)) on.push(1) });
            const all = tot.length > 0 && on.length === tot.length, part = on.length > 0 && !all, open = stCfg.open.has(c.k);
            h += '<div class="stc stl"><input type="checkbox" class="stlm" data-n="' + n + '"' + (all ? ' checked' : '') + (part ? ' data-p="1"' : '') + (tot.length ? '' : ' disabled') + '><span>' + esc(lecName(c.name)) + '</span><small>' + sq + ' محفوظ' + (fs.length ? ' · ' + fs.length + ' 📁' : '') + '</small><button type="button" class="stx" data-n="' + n + '" aria-label="فتح أو قفل">' + (open ? '▲' : '▼') + '</button></div>' +
              '<div class="stkids" data-n="' + n + '" style="margin-inline-start:20px' + (open ? '' : ';display:none') + '">' +
              '<label class="stc' + (sq ? '' : ' off') + '"><input type="checkbox" class="stcb" data-n="' + n + '"' + (stCfg.checked.has(c.k) ? ' checked' : '') + (sq ? '' : ' disabled') + '><span>🔖 المحفوظ العادي</span><small>' + sq + ' سؤال</small></label>' +
              fs.map(fRow2).join('') + '</div>';
          });
          const ln = lone.filter(f => f.sid === sid);
          if (ln.length) h += '<div class="svs">📁 أقسام أخرى</div>' + ln.map(fRow).join('');
        });
      } else {
        let lastS = null;
        list.forEach((c, n) => {
          if (!vl.includes(c)) return;
          if (bsubs.length > 1 && c.sid !== lastS) { lastS = c.sid; h += '<div class="stsh">' + esc(sName(c.sid)) + '</div>' }
          h += chRow(c, n);
        });
      }

      h += '<div class="svh">عدد الأسئلة <small>(المتاح: ' + av + ')</small></div>' +
        '<input type="number" id="stn" inputmode="numeric" min="1" max="' + av + '" value="' + stCfg.n + '" style="text-align:center;font-weight:700">' +
        '<div class="card" id="stt2" style="text-align:center">' + timeTxt() + '</div>' +
        '<button class="btn" id="stg"' + (av ? '' : ' disabled') + '>▶ ابدأ الاختبار</button>';
    }
    const hist = stLoad().filter(r => r.year === y && r.block === block);
    if (hist.length) {
      h += '<div class="svh">📊 نتايجك المحفوظة' + (hist.length > 1 ? ' <button type="button" class="link" id="sthc" style="float:left;padding:0">مسح الكل</button>' : '') + '</div>' +
        hist.map(r => '<div class="stH"><div><b dir="ltr">' + r.correct + ' / ' + r.total + ' (' + r.pct + '%)</b><br><small>' + stDate(r.at) + ' · ' + stClock(r.used) + ' من ' + stClock(r.secs) + (r.skipped ? ' · ' + r.skipped + ' متجاوبش' : '') + '</small></div><span style="display:flex;gap:6px"><button type="button" class="btn stv" data-id="' + r.id + '" title="مراجعة">👁 مراجعة</button><button type="button" class="btn no sth" data-id="' + r.id + '" title="حذف">🗑</button></span></div>').join('');
    }
    app.innerHTML = h; bindTop(); on('#bk', () => blocksView(y));
    document.querySelectorAll('.stm').forEach(b => b.onclick = () => setMode(b.dataset.m));
    const keep = () => { const y0 = window.scrollY; render(); window.scrollTo(0, y0) };
    document.querySelectorAll('.stcb').forEach(b => b.onchange = () => { const c = list[+b.dataset.n]; b.checked ? stCfg.checked.add(c.k) : stCfg.checked.delete(c.k); keep() });
    document.querySelectorAll('.stlm').forEach(b => {
      b.indeterminate = b.dataset.p === '1';
      b.onchange = () => {
        const c = list[+b.dataset.n], o = b.checked;
        if (c.qs.some(q => sv.has(q.id))) o ? stCfg.checked.add(c.k) : stCfg.checked.delete(c.k);
        myF.filter(f => f.sid === c.sid && f.ch === c.name && f.qs.length).forEach(f => o ? stCfg.fchecked.add(f.id) : stCfg.fchecked.delete(f.id));
        keep();

    document.querySelectorAll('.stx').forEach(b => b.onclick = () => {
      const c = list[+b.dataset.n], kid = document.querySelector('.stkids[data-n="' + b.dataset.n + '"]'); if (!kid) return;
      const o = kid.style.display === 'none'; kid.style.display = o ? '' : 'none'; b.textContent = o ? '▲' : '▼';
      o ? stCfg.open.add(c.k) : stCfg.open.delete(c.k);
    });
    document.querySelectorAll('.stfb').forEach(b => b.onchange = () => { b.checked ? stCfg.fchecked.add(b.dataset.f) : stCfg.fchecked.delete(b.dataset.f); keep() });
    on('#sta', () => { if (allOn()) { stCfg.checked = new Set(); stCfg.fchecked = new Set() } else { stCfg.checked = new Set(selC().map(c => c.k)); stCfg.fchecked = new Set(selF().map(f => f.id)) } render() });
    const ni = $('#stn'); if (ni) ni.oninput = () => { stCfg.n = Math.max(1, Math.min(+ni.value || 1, pool().length || 1)); const t = $('#stt2'); if (t) t.innerHTML = timeTxt() };
    on('#stg', () => { const av2 = pool().length; if (!av2) return alert('اختار قسم واحد على الأقل'); const n = Math.max(1, Math.min(+($('#stn').value) || stCfg.n, av2)); stCfg.n = n; startExam(n) });
    on('#sthc', () => { if (!confirm('تمسح كل نتايج الاختبارات المحفوظة للبلوك ده؟')) return; stSaveAll(stLoad().filter(r => !(r.year === y && r.block === block))); render() });
    document.querySelectorAll('.sth').forEach(b => b.onclick = () => { if (!confirm('تحذف النتيجة دي؟')) return; stSaveAll(stLoad().filter(r => String(r.id) !== b.dataset.id)); render() });
    document.querySelectorAll('.stv').forEach(b => b.onclick = () => stReviewView(b.dataset.id));
  }
  stCfg.back = render;
  render();
}

// مراجعة نتيجة اختبار قديم (من النتايج المحفوظة)
function stReviewView(rid, flt) {
  const r = stLoad().find(x => String(x.id) === String(rid));
  if (!r) return stHome(curYear, curBlock);
  view = 'streview'; flt = flt || 'all';
  const d = Array.isArray(r.d) ? r.d : null;
  const st = x => x.c === null ? 's' : x.r === null ? 'u' : x.c === x.r ? 'ok' : 'bad';
  let h = topBar() + BK('‹ اختبر نفسك') + '<h2>📋 مراجعة الاختبار</h2><div class="crumb">' + esc(yName(r.year)) + ' › ' + esc(r.block) + '</div>' +
    '<div class="card" style="text-align:center"><div dir="ltr"><b>' + r.correct + ' / ' + r.total + ' (' + r.pct + '%)</b></div><small>' + stDate(r.at) + ' · ' + stClock(r.used) + ' من ' + stClock(r.secs) + '</small></div>';
  if (!d) h += '<div class="card">النتيجة دي اتحفظت قبل ما المراجعة تتضاف، فمفيهاش تفاصيل الأسئلة. النتايج الجديدة بتتراجع بالكامل.</div>';
  else {
    const n = {all: d.length, bad: d.filter(x => st(x) === 'bad').length, ok: d.filter(x => st(x) === 'ok').length, s: d.filter(x => st(x) === 's').length};
    h += '<div class="row" id="srf">' + [['all', 'الكل'], ['bad', '❌ الغلط'], ['ok', '✅ الصح'], ['s', '⏭ متجاوبش']].map(([v, t]) => '<button type="button" class="stm' + (flt === v ? ' on' : '') + '" data-f="' + v + '">' + t + ' ' + n[v] + '</button>').join('') + '</div>';
    const tag = {ok: '✅', bad: '❌', s: '⏭ متجاوبش', u: '⚠ ماتصححش'};
    d.forEach((x, i2) => {
      const k2 = st(x); if (flt !== 'all' && k2 !== flt) return;
      h += '<div class="card"><small>' + (i2 + 1) + (x.g ? ' · ' + esc(lecName(x.g)) : '') + ' · ' + tag[k2] + '</small><p class="q" dir="auto">' + esc(x.b) + '</p>' +
        (x.ch || []).map((t, k) => '<div class="ch' + (k === x.r ? ' ok' : k === x.c ? ' bad' : '') + '" dir="auto"><b>' + 'ABCDE'[k] + '.</b> ' + esc(t) + (k === x.c ? ' ← إجابتك' : '') + '</div>').join('') + '</div>';
    });
  }
  app.innerHTML = h; bindTop();
  on('#bk', () => stHome(r.year, r.block));
  document.querySelectorAll('#srf button').forEach(b => b.onclick = () => stReviewView(r.id, b.dataset.f));
}

function stTick() {
  if (view !== 'stexam' || !stEx) return stStop();
  const left = Math.ceil((stEx.end - Date.now()) / 1000);
  const e = $('#stt'); if (e) { e.textContent = stClock(left); const bx = $('#stbx'); if (bx) bx.classList.toggle('lock', left <= 60) }
  if (left <= 0) stFinish(true);
}

async function stBookmark(q) {
  if (stBm.has(q.id)) return true;
  const {error} = await sb.from('bookmarks').insert({user_id: me.id, question_id: q.id});
  if (error && error.status !== 409) { alert('حصلت مشكلة في الحفظ، حاول تاني'); return false }
  stBm.add(q.id); saved.add(q.id); metaFor = null; return true;
}

function stExamView() {
  view = 'stexam'; const E = stEx, q = E.qs[E.i]; E.pend = E.pend || {};
  const cur = E.pend[q.id] !== undefined ? E.pend[q.id] : E.ans[q.id];
  const done = Object.keys(E.ans).length, left = Math.ceil((E.end - Date.now()) / 1000);
  app.innerHTML = topBar() + '<div class="tbar' + (left <= 60 ? ' lock' : '') + '" id="stbx">⏳ الوقت المتبقي: <b id="stt">' + stClock(left) + '</b></div>' +
    '<div class="bar"><button class="back" id="bk">‹ إلغاء</button><span>' + (E.i + 1) + ' / ' + E.qs.length + '</span><span><small>اتحفظ ' + done + '</small></span></div>' +
    '<div class="card"><small>' + esc(q.chapter || '') + '</small><p class="q" dir="auto">' + esc(q.body) + '</p>' +
    q.choices.map((c, k) => '<button class="ch' + (cur === k ? ' sel' : '') + '" data-k="' + k + '" dir="auto"><b>' + 'ABCDE'[k] + '.</b> ' + esc(c) + '</button>').join('') + '</div>' +
    '<div class="row"><button id="pv">السابق</button><button id="nx">🔖 حفظ' + (E.i < E.qs.length - 1 ? ' والتالي' : '') + '</button></div>' +
    '<div class="stg">' + E.qs.map((x, n) => '<button type="button" data-n="' + n + '" class="' + (E.ans[x.id] !== undefined ? 'dn ' : '') + (n === E.i ? 'cu' : '') + '">' + (n + 1) + '</button>').join('') + '</div>' +
    '<button class="btn" id="stf">✅ إنهاء الاختبار</button>';
  bindTop();
  const jump = n => { delete E.pend[q.id]; E.i = Math.max(0, Math.min(E.qs.length - 1, n)); stExamView() };   // التنقل من غير حفظ
  on('#bk', () => { if (!confirm('هتخرج من الاختبار وهيتلغي من غير نتيجة. متأكد؟')) return; stStop(); stEx = null; stHome(E.y, E.block) });
  on('#pv', () => jump(E.i - 1));
  on('#nx', async () => {
    const nb = $('#nx'); if (nb) nb.disabled = true;
    if (E.pend[q.id] !== undefined) { if (E.pend[q.id] === null) delete E.ans[q.id]; else E.ans[q.id] = E.pend[q.id]; delete E.pend[q.id] }
    if (!(await stBookmark(q))) { if (nb) nb.disabled = false; return stExamView() }
    E.i = Math.min(E.qs.length - 1, E.i + 1); stExamView();
  });
  document.querySelectorAll('.stg button').forEach(b => b.onclick = () => jump(+b.dataset.n));
  document.querySelectorAll('.card .ch').forEach(b => b.onclick = () => { const k = +b.dataset.k; E.pend[q.id] = (cur === k) ? null : k; stExamView() });
  on('#stf', () => {
    if (E.pend[q.id] !== undefined && !confirm('اخترت إجابة ولسه ماتحفظتش (دوس حفظ). لو أنهيت دلوقتي مش هتتحسب. تنهي؟')) return;
    const left2 = E.qs.length - Object.keys(E.ans).length;
    if (left2 && !confirm('لسه ' + left2 + ' سؤال ماتحفظتش إجابته. تنهي الاختبار؟')) return;
    stFinish(false);
  });
}

// التصحيح: الأسئلة اللي اتحلت قبل كده بنجيب مفتاحها، والجديدة بتتسجل في تقدمك عادي
async function stGrade(q, k, att) {
  const key = async () => { const r = await sb.rpc('get_answer_key', {qid: q.id}); return (r.error || !r.data) ? null : r.data.correct_index };
  if (!att[q.id]) {
    const r = await sb.rpc('submit_answer', {qid: q.id, idx: k});
    if (!r.error && r.data) { answered[q.id] = {chosen_index: k, is_correct: r.data.is_correct}; return {c: r.data.correct_index} }
  }
  const c = await key(); return c == null ? null : {c};
}

async function stFinish(auto) {
  const E = stEx; if (!E || E.busy) return; E.busy = true; stStop(); view = 'stgrade';
  const used = Math.min(E.secs, Math.round((Date.now() - E.t0) / 1000));
  app.innerHTML = topBar() + '<p style="padding:24px;text-align:center">' + (auto ? '⏰ الوقت خلص! ' : '') + 'جاري التصحيح...</p>'; bindTop();
  const items = E.qs.filter(q => E.ans[q.id] !== undefined), res = {};
  let p = 0;
  const worker = async () => { while (p < items.length) { const q = items[p++]; res[q.id] = await stGrade(q, E.ans[q.id], E.att) } };
  await Promise.all([worker(), worker(), worker(), worker(), worker()]);
  metaFor = null;
  let ok = 0, bad = 0, skip = 0, err = 0; const wrong = [];
  E.qs.forEach(q => {
    const c = E.ans[q.id], r = res[q.id];
    if (c === undefined) skip++;
    else if (!r) err++;
    else if (c === r.c) ok++;
    else { bad++; wrong.push({q, c, r: r.c}) }
  });
  const graded = E.qs.length - err;
  E.result = {id: Date.now(), at: new Date().toISOString(), year: E.y, block: E.block, total: E.qs.length, correct: ok, wrong: bad, skipped: skip, used, secs: E.secs, pct: E.qs.length ? Math.round(100 * ok / E.qs.length) : 0,
    d: E.qs.map(q => ({b: q.body, ch: q.choices, g: q.chapter || '', c: E.ans[q.id] === undefined ? null : E.ans[q.id], r: res[q.id] ? res[q.id].c : null}))};
  stResultView(wrong, err, auto);
}

function stResultView(wrong, err, auto) {
  view = 'stresult'; const E = stEx, r = E.result;
  const col = r.pct >= 75 ? '#2e9e5b' : r.pct >= 50 ? '#e0a526' : '#d64545';

const PZ = {anat: {tbl: 'practical_slides', name: 'عملي التشريح'}, histo: {tbl: 'practical_histo', name: 'عملي الهستولوجي'}};
const pzMetaC = {}; const pzImg = {}; const pzSavC = {};
async function practicalView(key) {

  const all = []; S.forEach((x, a) => x.m.forEach((_, k) => all.push([a, k])));
  let seq = all, p = 0, shown = false, els = [], cur = -1, onlySaved = false;

    '<div class="pz-top"><span id="pz1"></span><span id="pz2"></span></div><div class="pb"><i id="pz-bar" style="width:0"></i></div>' +
    '<button class="sub" id="pz-only" style="margin-top:8px;padding:8px"></button>' +
    '<div id="pz-wrap"><img id="pz-im" alt=""></div>' +
    '<div id="pz-done" hidden style="text-align:center;margin:14px 0"></div>' +
    '<div id="pz-panel"><button id="pz-prev">→ السابق</button><button id="pz-sv">🔖 حفظ</button><button id="pz-btn">أظهر الإجابة</button></div><div style="height:90px"></div>';
  bindTop(); on('#bk', () => blocksView(1));

    if (pzImg[key + n]) return pzImg[key + n];

    return pzImg[key + n] = r.data[0].img;
  }
  async function build(a) {
    if (a === cur) return true;

    const im = await load(S[a].ord); if (!im) return false;
    $('#pz-im').src = im; cur = a;
    els = S[a].m.map((m, k) => { const b = document.createElement('button'); b.className = 'pz-m'; b.style.cssText = 'left:' + m[0] + '%;top:' + m[1] + '%;width:' + m[2] + '%;height:' + m[3] + '%'; b.onclick = () => { const j = seq.findIndex(t => t[0] === a && t[1] === k); if (j >= 0) { p = j; shown = false; render(true) } }; $('#pz-wrap').appendChild(b); return b });
    const nx = seq[p + 1]; if (nx && !pzImg[key + S[nx[0]].ord]) load(S[nx[0]].ord);
    return true;
  }
  function render(sc) {
    const fin = p >= seq.length;
    $('#pz-only').textContent = onlySaved ? '↩ رجوع لكل الأسئلة' : '🔖 المحفوظات (' + sv.size + ')';
    $('#pz-done').hidden = !fin; $('#pz-panel').hidden = fin; $('#pz-wrap').hidden = fin;

    const [a, k] = seq[p];

    $('#pz1').textContent = (onlySaved ? 'محفوظ ' : 'السؤال ') + (p + 1) + ' من ' + seq.length;
    $('#pz2').textContent = 'الصورة ' + (a + 1) + ' من ' + S.length;
    $('#pz-bar').style.width = (p / seq.length * 100) + '%';
    $('#pz-prev').disabled = p === 0 && !shown;
    $('#pz-btn').textContent = shown ? 'التالي ←' : 'أظهر الإجابة';
    $('#pz-sv').textContent = sv.has(kOf(a, k)) ? '🔖 محفوظ' : '🔖 حفظ';
    if (sc && els[k]) els[k].scrollIntoView({block: 'center', behavior: 'smooth'});
  }
  async function start(only) {
    onlySaved = only; seq = only ? all.filter(([a, k]) => sv.has(kOf(a, k))) : all; p = 0; shown = false;
    if (!seq.length) { onlySaved = false; seq = all; alert('مفيش حاجة محفوظة لسه') }
    if (await build(seq[0][0])) { render(false); window.scrollTo({top: 0}) }
  }
  async function goTo(np, sh) {
    const old = p; p = np;
    if (p < seq.length && !await build(seq[p][0])) { p = old; return }
    shown = sh; render(true);
  }
  $('#pz-btn').onclick = async () => {
    if (!shown) { shown = true; render(false); return }

  $('#pz-prev').onclick = async () => {

    render(false);
  };
  $('#pz-only').onclick = () => start(!onlySaved);
  start(false);
}

const AUTHOR_TAGS = ['DR DINA', 'FORMATIVE'];
// 5) question sections of a lecture: all / important / by source / by type
function sectionsView(k) {
  if (k === undefined) k = curLec;
  view = 'sections'; curLec = k;
  const arr = k === LEC_ALL ? meta : meta.filter(q => chOf(q) === k);
  const secs = [];
  const mySaved = arr.filter(q => saved.has(q.id));
  if (mySaved.length) secs.push({t: '🔖 المحفوظات', saved: 1, a: mySaved});
  Array.from(new Set(arr.map(q => q.source_tag).filter(t => t && !AUTHOR_TAGS.includes(t)))).forEach(s => secs.push({t: s, f: {src: s}, a: arr.filter(q => q.source_tag === s)}));
  ['mcq', 'written'].forEach(t => {
    const a2 = arr.filter(q => q.type === t), nm = t === 'mcq' ? 'MCQ' : 'Written';
    const aus = Array.from(new Set(a2.map(q => q.source_tag).filter(x => AUTHOR_TAGS.includes(x))));
    const plain = a2.filter(q => !AUTHOR_TAGS.includes(q.source_tag));
    if (plain.length) secs.push({t: nm, f: aus.length ? {type: t, nosrc: 1} : {type: t}, a: plain});
    aus.forEach(au => secs.push({t: nm + ' (' + au + ')', f: {type: t, src: au}, a: a2.filter(q => q.source_tag === au)}));
  });
  app.innerHTML = topBar() + BK('‹ المحاضرات') + crumb() + '<h2>' + esc(lecName(k)) + '</h2>' +
    secs.map((s, n) => '<button class="sub sec" data-n="' + n + '"><b>' + esc(s.t) + '</b><br>' + (s.plain
      ? '<small>' + s.a.length + ' سؤال للمراجعة</small>'

// ترتيب الإجابة النموذجية: كل نقطة في سطر لوحدها
function fmtModel(t) {
  if (!t) return 'مفيش إجابة نموذجية';
  let s = String(t).replace(/\r/g, '').trim();
  s = s.replace(/([.:;!?\)\]])[ \t]+(?=(?:\d{1,2}[\)\.]|[A-Za-z]\))[ \t])/g, '$1\n');
  s = s.replace(/([^\n])[ \t]+(?=•[ \t])/g, '$1\n');
  s = s.replace(/([.:;])[ \t]+(?=[-–][ \t])/g, '$1\n');
  return s.split(/\n+/).map(l => l.trim()).filter(Boolean).map(l =>
    '<div class="ml' + (/^(\d{1,2}[\)\.]|[A-Za-z]\)|[-•–])\s/.test(l) ? ' pt' : '') + '">' + esc(l) + '</div>').join('');
}

// ===== أقسام المحفوظات =====
async function fetchFolders(mk) {
  let r = await fetchAll(() => mk('id,name,subject_id,chapter'));
  if (r.error) r = await fetchAll(() => mk('id,name,subject_id'));   // لو عمود chapter لسه ماتضافش
  if (!r.error && Array.isArray(r.data)) r.data = r.data.map(x => Object.assign({}, x, {chapter: x.chapter ? String(x.chapter).trim() : null}));
  return r;
}
async function folderCreate(name, chapter) {
  name = String(name || '').trim().slice(0, 40); if (!name) return null;
  const {data, error} = await sb.rpc('folder_create', {p_subject: curSub.id, p_name: name});
  if (error || !data || !data.ok) {
    alert(data && data.error === 'exists' ? 'القسم ده موجود بالفعل' : data && data.error === 'limit' ? 'وصلت للحد الأقصى من الأقسام' : 'حصلت مشكلة، اتأكد إنك شغّلت saved_folders.sql');
    return null;
  }
  const f = {id: data.id, name, subject_id: curSub.id, chapter: null};
  if (chapter && chapter !== LEC_ALL) { try { const b = await sb.rpc('folder_bind', {p_id: +data.id, p_chapter: chapter}); if (!b.error && b.data && b.data.ok) f.chapter = chapter; else f.chapter = chapter } catch (e) { f.chapter = chapter } }
  folders.push(f); fitems[f.id] = new Set(); return f;
}
function folderView(fid) {
  const f = folders.find(x => String(x.id) === String(fid)); if (!f) return savedTypes(savedLec);
  view = 'folder'; fromSaved = false;
  const mine = meta.filter(q => fitems[f.id].has(q.id));
  const secs = [['mcq', 'MCQ'], ['written', 'Written']].map(([t, n]) => ({t, n, a: mine.filter(q => q.type === t)})).filter(x => x.a.length);
  app.innerHTML = topBar() + BK('‹ المحفوظات') + crumb() + '<h2>📁 ' + esc(f.name) + '</h2>' +
    (secs.length ? secs.map((x, n) => '<button class="sub fvt" data-k="' + n + '"><b>' + x.n + '</b><br><small>' + solvedIn(x.a) + ' / ' + x.a.length + ' سؤال</small>' + bar(solvedIn(x.a), x.a.length) + '</button>').join('')
      : '<p>القسم فاضي. افتح أي سؤال محفوظ واضغط 📁 عشان تضيفه هنا.</p>') +
    '<div class="row"><button id="fr" type="button">✏️ تغيير الاسم</button><button id="fd" type="button">🗑 حذف القسم</button></div>';
  bindTop(); on('#bk', () => savedTypes(savedLec));
  document.querySelectorAll('.fvt').forEach(b => b.onclick = async () => {
    loading();
    const res = await fetchByIds(secs[+b.dataset.k].a.map(q => q.id));
    if (res.error) { alert('حصلت مشكلة، حاول تاني'); return folderView(f.id) }
    shuffled = false; fromFolder = f.id;
    qs = res.data.slice().sort((p, q) => chOf(p).localeCompare(chOf(q), 'ar', {numeric: true}) || p.id - q.id);
    fromSaved = true;
    const first = qs.findIndex(x => !answered[x.id]);
    i = first < 0 ? 0 : first; quizView();
  });
  on('#fr', async () => {
    const nm = String(prompt('اسم القسم الجديد؟', f.name) || '').trim().slice(0, 40); if (!nm || nm === f.name) return;
    const {data, error} = await sb.rpc('folder_rename', {p_id: f.id, p_name: nm});
    if (error || !data || !data.ok) return alert(data && data.error === 'exists' ? 'فيه قسم بنفس الاسم' : 'حصلت مشكلة، حاول تاني');
    f.name = nm; folderView(f.id);
  });
  on('#fd', async () => {
    if (!confirm('تحذف القسم "' + f.name + '"؟ الأسئلة المحفوظة هتفضل محفوظة.')) return;
    const {data, error} = await sb.rpc('folder_delete', {p_id: f.id});
    if (error || !data || !data.ok) return alert('حصلت مشكلة، حاول تاني');
    folders = folders.filter(x => x.id !== f.id); delete fitems[f.id]; savedTypes(savedLec);
  });
}
// نافذة اختيار الأقسام للسؤال الحالي (لو السؤال مش محفوظ بيتحفظ لما تضيفه لقسم)
function folderPicker(q) {
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.78);overflow:auto;padding:14px';
  const inAny = () => folders.some(f => fitems[f.id].has(q.id));
  const sync = () => { const d = ov.querySelector('#fpc'); if (d) d.disabled = !inAny() };
  const close = () => { ov.remove(); const st = $('#st'); if (st) st.textContent = saved.has(q.id) ? '★ محفوظ' : '☆ حفظ' };
  const cand = () => folders.filter(f => !f.chapter || f.chapter === chOf(q));
  const render = () => {
    ov.innerHTML = '<div class="card" style="max-width:520px;margin:16px auto"><h2>📁 أضف السؤال لقسم</h2>' +
      '<small>الأقسام هنا خاصة بمحاضرة السؤال ده بس.</small>' +
      (cand().length ? cand().map(f => '<label style="display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #3a1c1c"><input type="checkbox" data-id="' + f.id + '" style="width:auto;margin:0"' + (fitems[f.id].has(q.id) ? ' checked' : '') + '><span>' + esc(f.name) + '</span></label>').join('') : '<p>لسه معندكش أقسام للمحاضرة دي، اعمل أول قسم:</p>') +
      '<input id="fpn" maxlength="40" placeholder="اسم قسم جديد"><div class="row"><button class="btn ok" id="fpa" type="button">➕ إنشاء وإضافة</button><button class="btn no" id="fpc" type="button"' + (inAny() ? '' : ' disabled') + '>تم</button></div><button class="link" id="fpx" type="button" style="margin-top:10px">إلغاء</button></div>';
    ov.querySelectorAll('input[type=checkbox]').forEach(cb => cb.onchange = async () => {
      const id = cb.dataset.id, want = cb.checked; cb.disabled = true;
      const {data, error} = await sb.rpc('folder_set', {p_folder: +id, p_question: q.id, p_on: want});
      cb.disabled = false;
      if (error || !data || !data.ok) { cb.checked = !want; return alert(error && /wrong_lecture/.test(error.message || '') ? 'القسم ده خاص بمحاضرة تانية، مينفعش تضيف له سؤال من المحاضرة دي' : 'حصلت مشكلة، حاول تاني') }
      if (want) { fitems[id].add(q.id); saved.add(q.id); const ff = folders.find(x => String(x.id) === String(id)); if (ff && !ff.chapter) ff.chapter = chOf(q) } else fitems[id].delete(q.id);
      sync();
    });
    ov.querySelector('#fpc').onclick = () => { if (inAny()) close() };
    ov.querySelector('#fpx').onclick = close;
    ov.querySelector('#fpa').onclick = async () => {
      const f = await folderCreate(ov.querySelector('#fpn').value, chOf(q)); if (!f) return;
      const {data, error} = await sb.rpc('folder_set', {p_folder: +f.id, p_question: q.id, p_on: true});
      if (!error && data && data.ok) { fitems[f.id].add(q.id); saved.add(q.id) }
      render();
    };
  };
  render(); document.body.appendChild(ov);
}

// 6) load the chosen section and start the quiz
async function startQuiz(f) {
  loading();
  const res = await fetchAll(() => {
    let q = sb.from('questions').select('id,type,body,choices,chapter,source_tag,is_key_point').eq('subject_id', curSub.id);
    if (curLec !== LEC_ALL) q = curLec ? q.eq('chapter', curLec) : q.is('chapter', 'null');
    if (f.key) q = q.eq('is_key_point', 'true');
    if (f.src) q = q.eq('source_tag', f.src);
    if (f.nosrc) q = q.is('source_tag', 'null');
    if (f.type) q = q.eq('type', f.type);
    return q.order('id');
  });
  if (res.error) { alert(accMsg(res.error)); return sectionsView() }
  qs = res.data; fromSaved = false; shuffled = false;
  const first = qs.findIndex(x => !answered[x.id]);
  i = first < 0 ? 0 : first;
  quizView();
}

function go(d) { i = Math.max(0, Math.min(qs.length - 1, i + d)); quizView() }

function quizView() {
  view = 'quiz'; const q = qs[i];
  if (!q) {
    app.innerHTML = topBar() + BK('‹ رجوع') + '<div class="card">مفيش أسئلة في المادة دي لسه</div>';
    bindTop(); on('#bk', () => sectionsView()); return;
  }
  const a = answered[q.id];
  app.innerHTML = topBar() + `<div class="bar"><button class="back" id="bk">‹ رجوع</button><span>${i + 1} / ${qs.length}</span><span><button class="svb" id="st">${saved.has(q.id) ? '★ محفوظ' : '☆ حفظ'}</button>${foldersOk && !(stBack && stBack.qs === qs) ? ' <button class="svb" id="fl" type="button">📁</button>' : ''}</span></div>
    <div class="card"><small>${shuffled ? '🔀 ترتيب عشوائي · ' : ''}${q.is_key_point ? '⭐ ' : ''}${esc(q.chapter || '')} ${q.source_tag ? '· ' + esc(q.source_tag) : ''}</small>
    <p class="q" dir="auto">${esc(q.body)}</p><div id="ans"></div></div>
    <div class="row"><button id="pv">السابق</button><button id="nx">التالي</button></div><div class="rrow"><button class="link rbox" id="rs">🔄 حل من الأول</button><button class="link rbox" id="sh">🔀 لخبط الأسئلة</button></div>`;
  bindTop(); on('#bk', () => stBack && stBack.qs === qs ? stBack.f() : fromSaved ? (fromFolder ? folderView(fromFolder) : savedTypes()) : sectionsView()); on('#fl', () => folderPicker(q)); on('#pv', () => go(-1)); on('#nx', () => go(1));
  on('#rs', async () => {
    if (!confirm('هتمسح تقدمك في الأسئلة دي وتبدأ من الأول. الأسئلة المحفوظة هتفضل زي ما هي. متأكد؟')) return;
    const btn = $('#rs'); if (btn) btn.disabled = true;
    const ids = qs.map(x => x.id);
    const {error} = await sb.rpc('reset_progress', {qids: ids});
    if (error) { if (btn) btn.disabled = false; return alert('حصلت مشكلة، حاول تاني') }
    ids.forEach(id => { delete answered[id] }); i = 0; quizView();
  });
  on('#sh', () => {
    for (let k = qs.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [qs[k], qs[j]] = [qs[j], qs[k]] }
    shuffled = true;
    const f0 = qs.findIndex(x => !answered[x.id]); i = f0 < 0 ? 0 : f0; quizView();
  });
  on('#st', async () => {
    if (saved.has(q.id)) { await sb.from('bookmarks').delete().eq('question_id', q.id); saved.delete(q.id); Object.keys(fitems).forEach(k => fitems[k].delete(q.id)) }
    else { await sb.from('bookmarks').insert({user_id: me.id, question_id: q.id}); saved.add(q.id) }
    $('#st').textContent = saved.has(q.id) ? '★ محفوظ' : '☆ حفظ';
  });
  const box = $('#ans');
  if (q.type === 'mcq') {
    box.innerHTML = (q.choices || []).map((c, k) => `<button class="ch" data-k="${k}" dir="auto"><b>${'ABCDE'[k]}.</b> ${esc(c)}</button>`).join('');
    const mark = (k, cor) => document.querySelectorAll('.ch').forEach(b => {
      const n = +b.dataset.k; b.disabled = true;
      if (n === cor) b.classList.add('ok'); else if (n === k) b.classList.add('bad');
    });
    if (a) mark(a.chosen_index, a.is_correct ? a.chosen_index : -1);
    if (a && !a.is_correct) sb.rpc('get_answer_key', {qid: q.id}).then(r => { if (!r.error && r.data && qs[i] === q) mark(a.chosen_index, r.data.correct_index) });
    document.querySelectorAll('.ch').forEach(b => b.onclick = async () => {
      if (answered[q.id]) return;
      const k = +b.dataset.k, {data, error} = await sb.rpc('submit_answer', {qid: q.id, idx: k});
      if (error) return alert(accMsg(error));
      answered[q.id] = {chosen_index: k, is_correct: data.is_correct};
      mark(k, data.correct_index);
    });
  } else {
    box.innerHTML = '<textarea id="wa" rows="4" placeholder="اكتب إجابتك هنا..."></textarea><button class="btn" id="rv" style="background:#2a1616">إظهار الإجابة النموذجية</button><div id="mo" class="card" style="display:none" dir="auto"></div>';
    on('#rv', async () => {
      const {data, error} = await sb.rpc('reveal_model_answer', {qid: q.id});
      if (error) return alert(accMsg(error));
      $('#mo').style.display = 'block'; $('#mo').innerHTML = fmtModel(data);
    });
  }
}

async function qrLoad() {
  const {data} = await sb.from('quiz_results').select('id,title,winners,created_at').order('created_at', {ascending: false});
  return (data || []).map(r => ({id: r.id, title: r.title || '', winners: Array.isArray(r.winners) ? r.winners : [], at: r.created_at}));
}
async function quizResultView() {
  view = 'quizres';
  const back = () => curYear ? blocksView(curYear) : homeView();
  app.innerHTML = topBar() + BK('‹ رجوع') + '<h2>🏆 Quiz Result</h2><p>⏳ جاري التحميل...</p>';
  bindTop(); on('#bk', back);
  const list = await qrLoad();
  app.innerHTML = topBar() + BK('‹ رجوع') + '<h2>🏆 Quiz Result</h2>' +
    (list.length ? list.map(x => '<div style="display:flex;gap:8px;align-items:stretch"><button class="sub qrq" style="flex:1" data-id="' + x.id + '"><b>' + esc(x.title) + '</b><br><small>' + new Date(x.at).toLocaleDateString('ar-EG') + '</small></button>' + (me.is_admin ? '<button class="btn no qrd" style="width:auto;margin:0;padding:0 16px" type="button" data-id="' + x.id + '" title="حذف">🗑</button>' : '') + '</div>').join('') : '<p>لسه مفيش نتايج اختبارات</p>');
  bindTop(); on('#bk', back);
  document.querySelectorAll('.qrq').forEach(b => b.onclick = () => qrShow(list.find(x => String(x.id) === b.dataset.id)));
  document.querySelectorAll('.qrd').forEach(b => b.onclick = async () => {
    const x = list.find(v => String(v.id) === b.dataset.id);
    if (!x || !confirm('تحذف نتيجة "' + x.title + '"؟')) return;
    const {data, error} = await sb.rpc('admin_delete_quiz_result', {p_id: String(x.id)});
    if (error || !data || !data.ok) return alert('حصلت مشكلة: ' + ((error && error.message) || (data && data.error) || ''));
    quizResultView();
  });
}

function qrPhoto(file) {
  return new Promise(res => {
    const im = new Image(), u = URL.createObjectURL(file);
    im.onload = () => {
      const n = 260, c = document.createElement('canvas'); c.width = c.height = n;
      const m = Math.min(im.width, im.height);
      c.getContext('2d').drawImage(im, (im.width - m) / 2, (im.height - m) / 2, m, m, 0, 0, n, n);
      URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', 0.8));
    };
    im.onerror = () => res('');
    im.src = u;
  });
}
function qrAdminBind(list) {
  const ph = ['', '', ''], els = [...document.querySelectorAll('.qre')]; let cur = null;
  let fr = 'f36';
  const setFr = v => { fr = QR_FRAMES[v] ? v : 'f38'; document.querySelectorAll('#qfr button').forEach(b => b.classList.toggle('on', b.dataset.v === fr)); $('#qfp').src = QR_FRAMES[fr].img };
  document.querySelectorAll('#qfr button').forEach(b => b.onclick = () => setFr(b.dataset.v));
  setFr('f36');
  const setPh = (i, v) => { const pv = els[i].querySelector('.qpv'); ph[i] = v; if (v) { pv.src = v; pv.hidden = false } else { pv.hidden = true; pv.removeAttribute('src') } };
  const fill = id => {
    cur = id ? list.find(x => String(x.id) === String(id)) : null;
    setFr(cur ? ((cur.winners[0] || {}).frame || 'f38') : 'f36');
    $('#qt').value = cur ? cur.title : '';
    els.forEach((el, i) => { const x = cur ? (cur.winners[i] || {}) : {}; el.querySelector('.qn').value = x.name || ''; el.querySelector('.qs').value = x.score || ''; setPh(i, x.photo || '') });
    $('#qdel').hidden = !cur; $('#qm').textContent = '';
  };
  els.forEach((el, i) => {
    el.querySelector('.qf').onchange = async e => { const f = e.target.files[0]; if (!f) return; const p = await qrPhoto(f); if (p) setPh(i, p) };
    el.querySelector('.qx').onclick = () => setPh(i, '');
  });
  $('#qsel').onchange = e => fill(e.target.value);
  on('#qsave', async () => {
    const t = $('#qt').value.trim(); if (!t) return $('#qm').textContent = 'اكتب اسم الاختبار';
    const ws = els.map((el, i) => ({name: el.querySelector('.qn').value.trim(), score: el.querySelector('.qs').value.trim(), photo: ph[i] || ''}));
    ws.forEach(w => w.frame = fr);

    const {data, error} = await sb.rpc('admin_save_quiz_result', {p_id: cur ? cur.id : null, p_title: t, p_winners: ws});
    if (error || !data || !data.ok) return $('#qm').textContent = 'حصلت مشكلة: ' + ((error && (error.message + (error.status ? ' [' + error.status + ']' : ''))) || (data && data.error) || 'مفيش رد من السيرفر');
    alert('تم الحفظ ✅'); adminView();

    if (error || !data || !data.ok) return $('#qm').textContent = 'حصلت مشكلة: ' + ((error && error.message) || (data && data.error) || '');

  });
}

// مربع اشتراك البلوكات في صفحة الشحن
function blocksBox() {
  const items = Object.keys(blockShop.prices).map(k => { const i = k.indexOf('|'); return {y: +k.slice(0, i), b: k.slice(i + 1), pr: blockShop.prices[k]} });
  if (!items.length) return '';
  items.sort((a, b) => a.y - b.y || ((BLOCK_ORDER[a.y] || []).indexOf(a.b) + 1 || 999) - ((BLOCK_ORDER[b.y] || []).indexOf(b.b) + 1 || 999) || a.b.localeCompare(b.b));
  return '<div class="card" id="blkbox"><b>🧩 اشتراك البلوكات</b><p><small>الاشتراك دائم، ويفتح البلوك + اختبر نفسك.</small></p>' + items.map(x => {
    const own = blockShop.owned.has(bkKey(x.y, x.b));
    return '<div class="stH"><div><b>' + esc(x.b) + '</b><br><small>- البلوك<br>- اختبر نفسك</small></div><span>' +
      (own ? '✅ مفتوح' : me.is_admin ? '<b>' + x.pr + '</b> <i class="coin"></i>' : '<button type="button" class="btn bkb" data-y="' + x.y + '" data-b="' + esc(x.b) + '">🛒 اشتري (دائم) بـ ' + x.pr + ' <i class="coin"></i></button>') + '</span></div>';
  }).join('') + '</div>';
}

// ===== حماية المحتوى (ردع: مفيش طريقة تمنع تصوير الشاشة 100% من المتصفح) =====
function setWM() {
  const w = document.getElementById('wm');
  if (w) w.remove();
}
(function () {
  let t;
  const hide = ms => { document.body.classList.add('hid'); clearTimeout(t); if (ms) t = setTimeout(show, ms) };
  const show = () => { if (!document.hidden) document.body.classList.remove('hid') };
  const typing = e => e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
  document.addEventListener('visibilitychange', () => document.hidden ? hide() : show());
  window.addEventListener('focus', show);
  window.addEventListener('pageshow', show);
  document.addEventListener('keydown', e => {
    const k = (e.key || '').toLowerCase();
    if (k === 'printscreen' || k === 'meta' && e.shiftKey || (e.metaKey && e.shiftKey && /[345]/.test(k))) {
      hide(2500); try { navigator.clipboard.writeText('') } catch (x) {}
    }
    if ((e.ctrlKey || e.metaKey) && ['p', 's', 'u'].includes(k) || (e.ctrlKey || e.metaKey) && e.shiftKey && ['s', 'i', 'c', 'j'].includes(k) || k === 'f12') e.preventDefault();
  }, true);
  document.addEventListener('keyup', e => { if ((e.key || '').toLowerCase() === 'printscreen') { hide(2500); try { navigator.clipboard.writeText('') } catch (x) {} } }, true);
  ['contextmenu', 'copy', 'cut', 'dragstart', 'selectstart'].forEach(ev => document.addEventListener(ev, e => { if (!typing(e)) e.preventDefault() }, true));
  window.addEventListener('beforeprint', () => hide());
  // جهاز واحد بس: كل 25 ثانية نتأكد إن الجلسة لسه هي الفعّالة
  setInterval(async () => {
    if (!me || me.is_admin || view === 'auth' || view === 'blocked' || document.hidden) return;
    const {data: r} = await sb.rpc('my_access');
    if (r && !r.ok && r.reason === 'other_device') blockedView('other_device');
  }, 25000);
})();
