<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MEDRACE</title>

<style>
body{margin:0;background:#140a0a;color:#f4eaea;font:16px Cairo,system-ui,sans-serif}
.brand{max-width:560px;margin:0 auto;padding:10px 12px 0;display:flex;align-items:center;direction:ltr;gap:12px}.brand img{width:52px;height:52px;border-radius:12px;display:block;flex:none}.brand b{flex:1;text-align:center;font-size:1.35em;font-weight:900;letter-spacing:1px;padding-right:52px}
#app{max-width:560px;margin:auto;padding:12px}
.card{background:#241212;border:1px solid #3a1c1c;border-radius:14px;padding:16px;margin:10px 0}
input,textarea,select{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #3a1c1c;background:#1b0d0d;color:inherit;font:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.btn{width:100%;padding:12px;border:0;border-radius:10px;background:#c0262d;font-weight:700;margin-top:6px}
.btn:disabled{opacity:.5}
.ic{display:inline-block;width:50px;height:50px;vertical-align:middle;margin-inline-end:10px}.ic svg,.ic img{width:100%;height:100%;display:block;object-fit:contain}
.btn.ok{background:#1f7a3d}.btn.no{background:#555}
.link{background:none;border:0;color:#e88;padding:6px}.link.rbox{display:block;margin:12px auto 0;padding:9px 22px;border:1.5px solid #e88;border-radius:14px}.rrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}.rrow .rbox{margin:0}.pay-info a,.blk a{color:#ffd54a;font-weight:700;text-decoration:underline}
.back{display:inline-flex;align-items:center;gap:6px;background:#2a1414;border:1px solid #c0262d;color:#ffd0d0;border-radius:14px;padding:8px 18px;margin:8px 0;font:inherit;font-weight:700;cursor:pointer}.back:active{background:#3a1c1c}.bar .back{margin:0}
.pill{background:#3a1c1c;border:0;border-radius:20px;padding:6px 12px}
.qrrow{display:flex;justify-content:flex-end;margin:6px 0}
.qrb{background:linear-gradient(135deg,#0b5a5a,#12304f);border:1.5px solid #19a3a3;color:#e6fbff;border-radius:14px;padding:7px 14px;font:inherit;font-weight:700;font-size:.9em;cursor:pointer;direction:ltr}
.qp{position:relative;width:100%;container-type:inline-size;border-radius:14px;overflow:hidden;background:#fff;margin:8px 0}
.qp>img{width:100%;display:block;user-select:none;-webkit-user-drag:none}
.qph{position:absolute;overflow:hidden;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:9cqw;background:radial-gradient(circle,#16405c,#0a1a2c)}
.qph img{width:100%;height:100%;object-fit:cover}
.qpl{position:absolute;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:clamp(8px,2.4cqw,22px);padding:0 1.2cqw}
.qpl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.qrt{text-align:center;font-weight:700;color:#8fe0e0;margin:4px 0}
.qrl{font-size:1.05em}
.qre{border-top:1px solid #3a1c1c;margin-top:10px;padding-top:8px}
.qpv{width:70px;height:70px;border-radius:50%;object-fit:cover;margin-top:6px;display:block}.qpv[hidden]{display:none}
.tbar{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;background:#102b17;border:1px solid #1f6b36;color:#8be6a5;border-radius:10px;padding:8px 12px;margin:8px 0;font-size:.95em}.tbar b{font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}.tbar.lock{background:#2b1010;border-color:#7a2323;color:#ffb3b3}.tbar .btn{margin:0;width:auto;padding:8px 14px}.sub.locked{opacity:.6;cursor:pointer}
.lkm{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px}.lkc{max-width:340px;width:100%;text-align:center}.lkc .btn{width:100%;margin:8px 0}
.note{background:#10202b;border:1px solid #1f5f7a;color:#a8dcf5;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:.92em;line-height:1.7}.note a{color:#ffd54a;font-weight:700;text-decoration:underline}
.rate{background:#2b2410;border:1px solid #6b5410;color:#ffd54a;border-radius:10px;padding:8px 12px;margin:8px 0;font-size:.9em;text-align:center}
.coin{display:inline-block;width:1.15em;height:1.15em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe98a,#f2b900 60%,#b98300);border:2px solid #ffd54a;box-shadow:inset 0 0 0 2px #c99400;vertical-align:-.2em;margin-left:4px;position:relative}
.coin:after{content:'C';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 .7em/1 Arial,sans-serif;color:#7a5200}
.top,.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sub,.ch{display:block;width:100%;text-align:start;padding:14px;margin:8px 0;border-radius:12px;border:1px solid #3a1c1c;background:#241212}
.ch{background:#1b0d0d;padding:12px;margin:6px 0}
.ch.ok{border-color:#2e9e5b;background:#12301f}
.ch.bad{border-color:#d64545;background:#3a1414}
.row{display:flex;gap:6px;margin:6px 0}
.row button{flex:1;padding:10px;border-radius:10px;border:1px solid #3a1c1c;background:#1b0d0d}
.row .on{background:#c0262d;border-color:#c0262d}
.msg{color:#e88;min-height:1.2em}
.q{font-size:18px;line-height:1.7}
.ml{margin:6px 0;line-height:1.8}.ml.pt{margin-inline-start:6px}.svb{color:#fff;background:#241212;border:1px solid #c0262d;border-radius:10px;padding:8px 12px}.svh{margin:14px 0 4px;color:#e88;font-weight:700}.svs{margin:8px 0 2px;color:#aaa;font-size:13px}.sqi{display:block;width:100%;text-align:start;padding:10px 12px;margin:5px 0;border-radius:10px;border:1px solid #3a1c1c;background:#1b0d0d;line-height:1.6}
.pb{height:4px;background:#3a1c1c;border-radius:4px;margin-top:8px}
.pb i{display:block;height:100%;background:#c0262d;border-radius:4px}
.crumb{color:#a88;font-size:13px;margin:8px 0}
.lrow{display:flex;gap:8px;align-items:stretch}.lrow .sub{flex:1;width:auto}
.sub.mine{border-color:#c0262d}
.pz-top{display:flex;justify-content:space-between;font-size:14px;color:#a88;margin:6px 0}
#pz-wrap{position:relative;border-radius:10px;overflow:hidden;background:#fff;margin-top:8px;min-height:120px}
#pz-im{width:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.pz-m{position:absolute;border:0;border-radius:4px;background:#ffe066;padding:0;cursor:pointer}
.pz-m.on{outline:3px solid #c0262d;animation:pzp 1s infinite}
.pz-m.rev{background:transparent;outline:3px solid #c0262d}
@keyframes pzp{50%{outline-color:transparent}}
#pz-panel{position:fixed;left:0;right:0;bottom:0;background:#150a0a;border-top:1.5px solid #3a1c1c;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
#pz-panel{display:flex;gap:8px;justify-content:center}#pz-prev{padding:13px 16px;border-radius:12px;border:1px solid #c0262d;background:#241212;color:#fff;font:inherit;font-weight:700}#pz-prev:disabled{opacity:.35}#pz-sv{padding:13px 12px;border-radius:12px;border:1px solid #c0262d;background:#241212;color:#fff;font:inherit;font-weight:700}#pz-btn{display:block;flex:1;max-width:620px;margin:0;padding:13px;border-radius:12px;border:0;background:#c0262d;color:#fff;font:inherit;font-size:17px;font-weight:700}

.sub.prac{background:#0c2a33;border-color:#1aa3c4;color:#e6fbff;text-align:center}.sub.prac small{color:#8fd8e8}.sub.prac.soon{opacity:.4;filter:grayscale(1);cursor:not-allowed}
h3{margin:16px 0 4px;color:#e88}

.soonmsg{text-align:center;font-weight:700;font-size:1.2rem;padding:10px;margin:8px 0;border:1px dashed #c0262d;border-radius:12px;color:#ffb3b6}
.row button.soon{opacity:.4;filter:grayscale(1);cursor:not-allowed;background:#1b0d0d}.row button.soon small{color:#e88}
.sub30{margin:12px 0;padding:12px;border:1px solid #c0262d;border-radius:12px;background:#1b0d0d;line-height:1.8}
.sub30 .btn{margin-top:8px}
.sub30.f7{border-color:#1f6b36;background:#0e1f13}.tbar.f7b{background:#0e1f13;border-color:#1f6b36}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
img{-webkit-user-drag:none;pointer-events:none}
#wm{position:fixed;inset:0;z-index:99999;pointer-events:none}
body.hid #app{filter:blur(40px);pointer-events:none}
body.hid::after{content:'🔒 المحتوى محمي';position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0d0606;color:#fff;font-size:20px;z-index:100000}
@media print{body{display:none!important}}

function makeClient(url, key) {
  let sess = null;
  try { sess = JSON.parse(ls.get('sbsess') || 'null') } catch (e) {}
  const save = s => {
    if (s && !s.expires_at) s.expires_at = Math.floor(Date.now() / 1000) + (s.expires_in || 3600);
    sess = s;
    try { s ? ls.set('sbsess', JSON.stringify(s)) : ls.del('sbsess') } catch (e) {}
  };
  const read = async r => {
    const t = await r.text(); let j = null;
    try { j = t ? JSON.parse(t) : null } catch (e) {}
    if (!r.ok) return { data: null, error: { message: (j && (j.message || j.msg || j.error_description || j.error)) || r.statusText, status: r.status } };
    return { data: j, error: null };
  };
  let refreshing = null;
  const ensure = async () => {
    if (!sess || !sess.refresh_token || sess.expires_at - 60 > Date.now() / 1000) return;
    if (!refreshing) refreshing = (async () => {
      try {
        const r = await fetch(url + '/auth/v1/token?grant_type=refresh_token', { method: 'POST', headers: { apikey: key, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: sess.refresh_token }) });
        if (r.ok) save(await r.json());
        else if (r.status === 400 || r.status === 401) { await new Promise(z => setTimeout(z, 700)); try { const cur = JSON.parse(ls.get('sbsess') || 'null'); if (cur && cur.expires_at - 60 > Date.now() / 1000) sess = cur; else save(null) } catch (e) { save(null) } }
      } catch (e) { /* network blip: keep the session, try again on the next call */ }
      finally { refreshing = null }
    })();
    await refreshing;
  };
  const headers = extra => {
    const h = Object.assign({ apikey: key, 'Content-Type': 'application/json' }, extra);
    if (sess) h.Authorization = 'Bearer ' + sess.access_token;
    return h;
  };
  const call = async (path, opt) => {
    await ensure();
    const go = async () => {
      try {
        const ex = {}, oh = (opt && opt.headers) || {};
        ['Prefer', 'Accept', 'Content-Profile'].forEach(k => { if (oh[k]) ex[k] = oh[k] });
        return await read(await fetch(url + path, Object.assign({}, opt, { headers: headers(ex) })));
      } catch (e) { return { data: null, error: { message: 'network', status: 0 } } }
    };
    let r = await go();
    if (r.error && (r.error.status === 0 || r.error.status === 401)) { await new Promise(z => setTimeout(z, 600)); if (r.error.status === 401 && sess) { sess.expires_at = 0; await ensure() } r = await go() }
    return r;
  };

  class Q {
    constructor(t) { this.t = t; this.p = new URLSearchParams(); this.o = []; this.m = 'GET'; this.b = null; this.one = false }
    select(c = '*') { this.p.set('select', c); return this }
    insert(b) { this.m = 'POST'; this.b = b; return this }
    delete() { this.m = 'DELETE'; return this }
    eq(c, v) { this.p.append(c, 'eq.' + v); return this }
    order(c, o = {}) { this.o.push(c + (o.ascending === false ? '.desc' : '.asc')); return this }
    limit(n) { this.p.set('limit', n); return this }
    offset(n) { this.p.set('offset', n); return this }
    inList(c, arr) { this.p.append(c, 'in.(' + arr.join(',') + ')'); return this }
    is(c, v) { this.p.append(c, 'is.' + v); return this }
    single() { this.one = true; return this }
    then(a, b) {
      if (this.o.length) this.p.set('order', this.o.join(','));
      const extra = {};
      if (this.one) extra.Accept = 'application/vnd.pgrst.object+json';
      if (this.m !== 'GET') extra.Prefer = 'return=minimal';
      const qs = this.p.toString().replace(/\+/g, '%20');
      return call('/rest/v1/' + this.t + (qs ? '?' + qs : ''), { method: this.m, headers: headers(extra), body: this.b ? JSON.stringify(this.b) : undefined }).then(a, b);
    }
  }
  return {
    from: t => new Q(t),
    fn: async (n, body) => { await ensure(); return read(await fetch(url + '/functions/v1/' + n, { method: 'POST', headers: headers(), body: JSON.stringify(body || {}) })) },
    rpc: (n, args) => call('/rest/v1/rpc/' + n, { method: 'POST', headers: headers(), body: JSON.stringify(args || {}) }),
    auth: {
      getSession: async () => { await ensure(); return { data: { session: sess } } },
      signInWithPassword: async ({ email, password }) => {
        const r = await read(await fetch(url + '/auth/v1/token?grant_type=password', { method: 'POST', headers: { apikey: key, 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) }));
        if (r.error) return { data: null, error: r.error };
        save(r.data); return { data: r.data, error: null };
      },
      signOut: async () => {
        try { if (sess) await fetch(url + '/auth/v1/logout', { method: 'POST', headers: headers() }) } catch (e) {}
        save(null); return { error: null };
      }
    }
  };
}

  for (;;) {
    const {data, error} = await mk().limit(1000).offset(from);
    if (error) return {data: null, error};
    all = all.concat(data || []);

    from += 1000;

  for (let k = 0; k < ids.length; k += 200) {
    const {data, error} = await sb.from('questions').select('id,type,body,choices,chapter,source_tag,is_key_point').inList('id', ids.slice(k, k + 200)).order('id');
    if (error) return {data: null, error};
    all = all.concat(data || []);
  }
  all.sort((a, b) => a.id - b.id);
  return {data: all, error: null};
}

// 1) years
async function homeView() {
  view = 'home'; curYear = 0; curBlock = null; curSub = null; curLec = null;
  const {data: s} = await sb.from('subjects').select('*').order('year').order('block').order('name');
  subs = s || [];
  if (!me.is_admin) return blocksView(me.year);   // الطالب يشوف فرقته بس
  const cnt = y => subs.filter(x => x.year === y).length;
  app.innerHTML = topBar() + qrBtn() + '<h2>اختار الفرقة</h2>' + [1, 2, 3].map(y =>
    '<button class="sub' + (y === me.year ? ' mine' : '') + '" data-y="' + y + '"><b>' + yName(y) + '</b>' + (y === me.year ? ' <small>(فرقتك)</small>' : '') +
    '<br><small>' + (cnt(y) ? cnt(y) + ' مادة' : 'قريباً') + '</small></button>').join('');
  bindTop();
  document.querySelectorAll('.sub').forEach(b => b.onclick = () => blocksView(+b.dataset.y));
}

function icon(name) {

  const k = /anat/.test(n) ? 'anat' : /embry/.test(n) ? 'embry' : /physio/.test(n) ? 'physio' : /histo/.test(n) ? 'histo' :
    /biochem/.test(n) ? 'biochem' : /terminolog/.test(n) ? 'termin' : /^micro/.test(n.trim()) ? 'micro' : /^cns$|neuro/.test(n.trim()) ? 'cns' : /renal/.test(n) ? 'renal' : /^resp/.test(n.trim()) ? 'resp' : /patho/.test(n) ? 'patho' : '';

}

// 2) blocks of a year
function blocksView(y) {
  pracMode = false; view = 'blocks'; curYear = y; curBlock = null; curSub = null; curLec = null;
  const list = subs.filter(x => x.year === y);
  const blocks = [...new Set(list.map(x => x.block))].sort((a, b) => {
    const o = BLOCK_ORDER[y] || [], ia = o.indexOf(a), ib = o.indexOf(b);
    return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib) || a.localeCompare(b);
  });
  let html = topBar() + qrBtn() + (me.is_admin ? BK('‹ الفرق') : '') + crumb() + '<h2>' + yName(y) + ' - اختار البلوك</h2>';
  if (!blocks.length) html += '<p>لسه مفيش مواد</p>';
  blocks.forEach((b, n) => {
    const c = list.filter(x => x.block === b).length;
    const bt = '<button class="sub blk" data-n="' + n + '">' + icon(b) + '<b>' + esc(b) + '</b>' + (c > 1 ? '<br><small>' + c + ' مادة</small>' : '') + '</button>';
    const pk = y === 1 ? (b === 'Anatomy' ? 'anat' : b === 'Terminology' ? null : 'soon') : 'soon';
    html += pk
      ? '<div class="lrow">' + bt + (pk === 'soon' ? '<button class="sub prac soon" disabled><b>PRACTICAL</b><br><small>قريباً</small></button></div>' : '<button class="sub prac" data-pk="' + pk + '"><b>PRACTICAL</b><br><small>' + (pk === 'bio' ? 'عملي البايوكيمستري' : PZ[pk].name) + '</small></button></div>')
      : bt;
  });
  app.innerHTML = html; bindTop(); on('#bk', () => homeView());
  document.querySelectorAll('.prac').forEach(pb => pb.onclick = () => { if (pb.dataset.pk === 'bio') { const sb1 = subs.find(x => x.year === 1 && x.block === 'Biochemistry'); if (!sb1) return alert('لسه مفيش عملي'); curBlock = 'Biochemistry'; pracMode = true; lecturesView(sb1) } else practicalView(pb.dataset.pk) });
  document.querySelectorAll('.blk').forEach(btn => btn.onclick = () => {
    const b = blocks[+btn.dataset.n], only = list.filter(x => x.block === b);
    if (only.length === 1) { curBlock = b; lecturesView(only[0]) } else subjectsView(y, b);
  });
}

    $('#pz1').textContent = (onlySaved ? 'محفوظ ' : 'السؤال ') + (p + 1) + ' من ' + seq.length;
    $('#pz2').textContent = 'الصورة ' + (a + 1) + ' من ' + S.length;
    $('#pz-bar').style.width = (p / seq.length * 100) + '%';
    $('#pz-prev').disabled = p === 0 && !shown;
    $('#pz-btn').textContent = shown ? 'التالي ←' : 'أظهر الإجابة';
    $('#pz-sv').textContent = sv.has(kOf(a, k)) ? '🔖 محفوظ' : '🔖 حفظ';
    if (sc && els[k]) els[k].scrollIntoView({block: 'center', behavior: 'smooth'});
  }
  async function start(only) {
    onlySaved = only; seq = only ? all.filter(([a, k]) => sv.has(kOf(a, k))) : all; p = 0; shown = false;
    if (!seq.length) { onlySaved = false; seq = all; alert('مفيش حاجة محفوظة لسه') }
    if (await build(seq[0][0])) { render(false); window.scrollTo({top: 0}) }
  }
  async function goTo(np, sh) {
    const old = p; p = np;
    if (p < seq.length && !await build(seq[p][0])) { p = old; return }
    shown = sh; render(true);
  }
  $('#pz-btn').onclick = async () => {
    if (!shown) { shown = true; render(false); return }
    await goTo(p + 1, false);
    if (p < seq.length) window.scrollTo({top: 0}), render(true);
  };
  $('#pz-prev').onclick = async () => {
    if (shown) { shown = false; render(true); return }
    if (p > 0) await goTo(p - 1, false);
  };
  $('#pz-sv').onclick = async () => {
    const [a, k] = seq[p], id = kOf(a, k);
    if (sv.has(id)) { sv.delete(id); const r = await sb.from('practical_saves').delete().eq('kind', key).eq('ord', S[a].ord).eq('idx', k); if (r.error) { sv.add(id); alert(accMsg(r.error)) } }
    else { sv.add(id); const r = await sb.from('practical_saves').insert({user_id: me.id, kind: key, ord: S[a].ord, idx: k}); if (r.error) { sv.delete(id); alert('مقدرتش أحفظ، اتأكد إنك شغّلت practical_saves.sql') } }
    render(false);
  };
  $('#pz-only').onclick = () => start(!onlySaved);
  start(false);
}

// 3) subjects of a block
function subjectsView(y, block) {
  view = 'subjects'; curYear = y; if (block !== undefined) curBlock = block; curSub = null; curLec = null;
  const list = subs.filter(x => x.year === y && x.block === curBlock);
  let html = topBar() + BK('‹ البلوكات') + crumb() + '<h2>' + esc(curBlock) + '</h2>';
  if (!list.length) html += '<p>لسه مفيش مواد</p>';
  list.forEach(x => { html += '<button class="sub" data-id="' + x.id + '">' + icon(x.name) + '<b>' + esc(x.name) + '</b></button>' });
  app.innerHTML = html; bindTop(); on('#bk', () => blocksView(curYear));
  document.querySelectorAll('.sub').forEach(b => b.onclick = () => lecturesView(subs.find(x => x.id === +b.dataset.id)));
}

const backFromLec = () => subs.filter(x => x.year === curYear && x.block === curBlock).length === 1 ? blocksView(curYear) : subjectsView(curYear);

// 4) lectures of a subject (a lecture = the "chapter" column)
let pracMode = false;
const isPrac = c => /^\s*practical\b/i.test(c || '');
async function lecturesView(sub) {
  view = 'lectures'; curSub = sub; curLec = null;
  if (!unlocked()) {
    loading();
    const {data: ls, error: le} = await sb.rpc('list_lectures', {sid: sub.id});
    metaFor = null;
    let h = topBar() + BK(subs.filter(x => x.year === curYear && x.block === curBlock).length === 1 ? '‹ البلوكات' : '‹ المواد') + crumb() + '<h2>' + icon(sub.name) + esc(sub.name) + '</h2>';
    if (le) h += '<p>حصلت مشكلة، حاول تاني</p>';
    else if (!(ls || []).filter(x => isPrac(x.chapter) === pracMode).length) h += '<p>لسه مفيش أسئلة في المادة دي</p>';
    else (ls || []).filter(x => isPrac(x.chapter) === pracMode).slice().sort((a, b) => a.chapter.localeCompare(b.chapter, 'ar', {numeric: true})).forEach(x => { h += '<button class="sub locked lkb"><b>🔒 ' + esc(lecName(x.chapter)) + '</b><br><small>' + x.n + ' سؤال</small></button>' });
    app.innerHTML = h; bindTop(); on('#bk', backFromLec);
    document.querySelectorAll('.lkb').forEach(b => b.onclick = lockedPrompt);
    return;
  }
  if (metaFor !== sub.id) {
    loading();
    const [m, a, b] = await Promise.all([
      fetchAll(() => sb.from('questions').select('id,type,chapter,source_tag,is_key_point').eq('subject_id', sub.id).order('id')),
      fetchAll(() => sb.from('attempts').select('question_id,chosen_index,is_correct').order('question_id')),
      sb.from('bookmarks').select('question_id')
    ]);
    if (m.error) { alert(accMsg(m.error)); return backFromLec() }
    meta = m.data; answered = {};
    (a.data || []).forEach(x => answered[x.question_id] = x);
    saved = new Set((b.data || []).map(x => x.question_id));
    metaFor = sub.id;
  }
  const groups = {};
  meta.forEach(q => { if (isPrac(chOf(q)) === pracMode) (groups[chOf(q)] = groups[chOf(q)] || []).push(q) });
  const card = (k, t, arr) => {
    return '<div class="lrow"><button class="sub lec" data-k="' + esc(k) + '"><b>' + esc(t) + '</b><br><small>' + solvedIn(arr) + ' / ' + arr.length + ' سؤال</small>' + bar(solvedIn(arr), arr.length) + '</button></div>';
  };
  let html = topBar() + BK(subs.filter(x => x.year === curYear && x.block === curBlock).length === 1 ? '‹ البلوكات' : '‹ المواد') + crumb() + '<h2>' + icon(sub.name) + (pracMode ? 'PRACTICAL - ' : '') + esc(sub.name) + '</h2>';
  if (!Object.keys(groups).length) html += '<p>لسه مفيش أسئلة في ' + (pracMode ? 'العملي ده' : 'المادة دي') + '</p>';
  else {
    Object.keys(groups).sort((a, b) => a.localeCompare(b, 'ar', {numeric: true})).forEach(k => { html += card(k, lecName(k), groups[k]) });
  }
  app.innerHTML = html; bindTop(); on('#bk', backFromLec);
  document.querySelectorAll('.lec').forEach(b => b.onclick = () => sectionsView(b.dataset.k));
}

// تصنيفات بتتعرض بين قوسين جنب MCQ/Written بدل ما تبقى قسم لوحدها
const AUTHOR_TAGS = ['DR DINA', 'FORMATIVE'];
// 5) question sections of a lecture: all / important / by source / by type
function sectionsView(k) {
  if (k === undefined) k = curLec;
  view = 'sections'; curLec = k;
  const arr = k === LEC_ALL ? meta : meta.filter(q => chOf(q) === k);
  const secs = [];
  const mySaved = arr.filter(q => saved.has(q.id));
  if (mySaved.length) secs.push({t: '🔖 المحفوظات', saved: 1, a: mySaved});
  Array.from(new Set(arr.map(q => q.source_tag).filter(t => t && !AUTHOR_TAGS.includes(t)))).forEach(s => secs.push({t: s, f: {src: s}, a: arr.filter(q => q.source_tag === s)}));
  ['mcq', 'written'].forEach(t => {
    const a2 = arr.filter(q => q.type === t), nm = t === 'mcq' ? 'MCQ' : 'Written';
    const aus = Array.from(new Set(a2.map(q => q.source_tag).filter(x => AUTHOR_TAGS.includes(x))));
    const plain = a2.filter(q => !AUTHOR_TAGS.includes(q.source_tag));
    if (plain.length) secs.push({t: nm, f: aus.length ? {type: t, nosrc: 1} : {type: t}, a: plain});
    aus.forEach(au => secs.push({t: nm + ' (' + au + ')', f: {type: t, src: au}, a: a2.filter(q => q.source_tag === au)}));
  });
  app.innerHTML = topBar() + BK('‹ المحاضرات') + crumb() + '<h2>' + esc(lecName(k)) + '</h2>' +
    secs.map((s, n) => '<button class="sub sec" data-n="' + n + '"><b>' + esc(s.t) + '</b><br>' + (s.plain
      ? '<small>' + s.a.length + ' سؤال للمراجعة</small>'
      : '<small>' + solvedIn(s.a) + ' / ' + s.a.length + (s.saved ? ' سؤال محفوظ' : ' سؤال') + '</small>' + bar(solvedIn(s.a), s.a.length)) + '</button>').join('');
  bindTop(); on('#bk', () => lecturesView(curSub));
  document.querySelectorAll('.sec').forEach(b => b.onclick = () => {
    const sc = secs[+b.dataset.n];
    if (sc.saved) return savedTypes(k);
    if (sc.f.type && sc.a.some(q => q.is_key_point)) return typeKeyView(sc, k);
    startQuiz(sc.f);
  });
}

// MCQ / Written: المهم يظهر كخيار جوّاه
function typeKeyView(sc, k) {
  view = 'keytypes';
  const keyA = sc.a.filter(q => q.is_key_point);
  const opts = [{t: 'كل الأسئلة', f: Object.assign({}, sc.f), a: sc.a}, {t: PREDICTED_KEY.has(k) ? '⭐ مهم' : '⭐ المهم (ركّز عليه الدكتور)', f: Object.assign({key: 1}, sc.f), a: keyA}];
  app.innerHTML = topBar() + BK('‹ رجوع') + crumb() + '<h2>' + esc(sc.t) + '</h2>' +
    opts.map((x, n) => '<button class="sub kty" data-n="' + n + '"><b>' + esc(x.t) + '</b><br><small>' + solvedIn(x.a) + ' / ' + x.a.length + ' سؤال</small>' + bar(solvedIn(x.a), x.a.length) + '</button>').join('');

// المهم: لو فيه اختياري ومقالي يخيّره الأول
function keyTypesView(sc) {
  view = 'keytypes';
  const ts = [['mcq', 'MCQ'], ['written', 'Written']].map(([t, n]) => ({t, n, a: sc.a.filter(q => q.type === t)})).filter(x => x.a.length);
  app.innerHTML = topBar() + BK('‹ رجوع') + crumb() + '<h2>' + esc(sc.t) + '</h2>' +
    ts.map((x, n) => '<button class="sub kty" data-n="' + n + '"><b>' + x.n + '</b><br><small>' + solvedIn(x.a) + ' / ' + x.a.length + ' سؤال</small>' + bar(solvedIn(x.a), x.a.length) + '</button>').join('');
  bindTop(); on('#bk', () => sectionsView());
  document.querySelectorAll('.kty').forEach(b => b.onclick = () => startQuiz({key: 1, type: ts[+b.dataset.n].t}));
}

// ترتيب الإجابة النموذجية: كل نقطة في سطر لوحدها
function fmtModel(t) {
  if (!t) return 'مفيش إجابة نموذجية';
  let s = String(t).replace(/\r/g, '').trim();
  s = s.replace(/([.:;!?\)\]])[ \t]+(?=(?:\d{1,2}[\)\.]|[A-Za-z]\))[ \t])/g, '$1\n');
  s = s.replace(/([^\n])[ \t]+(?=•[ \t])/g, '$1\n');
  s = s.replace(/([.:;])[ \t]+(?=[-–][ \t])/g, '$1\n');
  return s.split(/\n+/).map(l => l.trim()).filter(Boolean).map(l =>
    '<div class="ml' + (/^(\d{1,2}[\)\.]|[A-Za-z]\)|[-•–])\s/.test(l) ? ' pt' : '') + '">' + esc(l) + '</div>').join('');
}

// المحفوظات بتتفتح من جوه كل محاضرة (اختياري / مقالي لو موجود) وبعدين الحل زي الطبيعي
function savedTypes(k) {
  if (k === undefined) k = savedLec;
  view = 'savedtypes'; savedLec = k; fromSaved = false;
  const mine = meta.filter(q => saved.has(q.id) && (k === LEC_ALL || chOf(q) === k));
  const secs = [['mcq', 'MCQ'], ['written', 'Written']].map(([t, n]) => ({t, n, a: mine.filter(q => q.type === t)})).filter(x => x.a.length);
  curLec = k;
  app.innerHTML = topBar() + BK('‹ رجوع') + crumb() + '<h2>🔖 ' + esc(lecName(k)) + '</h2>' +
    secs.map((x, n) => '<button class="sub svt" data-k="' + n + '"><b>' + x.n + '</b><br><small>' + solvedIn(x.a) + ' / ' + x.a.length + ' سؤال محفوظ</small>' + bar(solvedIn(x.a), x.a.length) + '</button>').join('');
  bindTop(); on('#bk', () => sectionsView(k));
  document.querySelectorAll('.svt').forEach(b => b.onclick = async () => {
    loading();
    const res = await fetchByIds(secs[+b.dataset.k].a.map(q => q.id));
    if (res.error) { alert('حصلت مشكلة، حاول تاني'); return savedTypes(k) }
    shuffled = false;
    qs = res.data.slice().sort((p, q) => chOf(p).localeCompare(chOf(q), 'ar', {numeric: true}) || p.id - q.id);
    fromSaved = true;
    const first = qs.findIndex(x => !answered[x.id]);
    i = first < 0 ? 0 : first; quizView();
  });
}

// 6) load the chosen section and start the quiz
async function startQuiz(f) {
  loading();
  const res = await fetchAll(() => {
    let q = sb.from('questions').select('id,type,body,choices,chapter,source_tag,is_key_point').eq('subject_id', curSub.id);
    if (curLec !== LEC_ALL) q = curLec ? q.eq('chapter', curLec) : q.is('chapter', 'null');
    if (f.key) q = q.eq('is_key_point', 'true');
    if (f.src) q = q.eq('source_tag', f.src);
    if (f.nosrc) q = q.is('source_tag', 'null');
    if (f.type) q = q.eq('type', f.type);
    return q.order('id');
  });
  if (res.error) { alert(accMsg(res.error)); return sectionsView() }
  qs = res.data; fromSaved = false; shuffled = false;
  const first = qs.findIndex(x => !answered[x.id]);
  i = first < 0 ? 0 : first;
  quizView();
}

function go(d) { i = Math.max(0, Math.min(qs.length - 1, i + d)); quizView() }

function quizView() {
  view = 'quiz'; const q = qs[i];
  if (!q) {
    app.innerHTML = topBar() + BK('‹ رجوع') + '<div class="card">مفيش أسئلة في المادة دي لسه</div>';
    bindTop(); on('#bk', () => sectionsView()); return;
  }
  const a = answered[q.id];
  app.innerHTML = topBar() + `<div class="bar"><button class="back" id="bk">‹ رجوع</button><span>${i + 1} / ${qs.length}</span><button class="svb" id="st">${saved.has(q.id) ? '★ محفوظ' : '☆ حفظ'}</button></div>
    <div class="card"><small>${shuffled ? '🔀 ترتيب عشوائي · ' : ''}${q.is_key_point ? '⭐ ' : ''}${esc(q.chapter || '')} ${q.source_tag ? '· ' + esc(q.source_tag) : ''}</small>
    <p class="q" dir="auto">${esc(q.body)}</p><div id="ans"></div></div>
    <div class="row"><button id="pv">السابق</button><button id="nx">التالي</button></div><div class="rrow"><button class="link rbox" id="rs">🔄 حل من الأول</button><button class="link rbox" id="sh">🔀 لخبط الأسئلة</button></div>`;
  bindTop(); on('#bk', () => fromSaved ? savedTypes() : sectionsView()); on('#pv', () => go(-1)); on('#nx', () => go(1));
  on('#rs', async () => {
    if (!confirm('هتمسح تقدمك في الأسئلة دي وتبدأ من الأول. الأسئلة المحفوظة هتفضل زي ما هي. متأكد؟')) return;
    const btn = $('#rs'); if (btn) btn.disabled = true;
    const ids = qs.map(x => x.id);
    const {error} = await sb.rpc('reset_progress', {qids: ids});
    if (error) { if (btn) btn.disabled = false; return alert('حصلت مشكلة، حاول تاني') }
    ids.forEach(id => { delete answered[id] }); i = 0; quizView();
  });
  on('#sh', () => {
    for (let k = qs.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [qs[k], qs[j]] = [qs[j], qs[k]] }
    shuffled = true;
    const f0 = qs.findIndex(x => !answered[x.id]); i = f0 < 0 ? 0 : f0; quizView();
  });
  on('#st', async () => {
    if (saved.has(q.id)) { await sb.from('bookmarks').delete().eq('question_id', q.id); saved.delete(q.id) }
    else { await sb.from('bookmarks').insert({user_id: me.id, question_id: q.id}); saved.add(q.id) }
    $('#st').textContent = saved.has(q.id) ? '★ محفوظ' : '☆ حفظ';
  });
  const box = $('#ans');
  if (q.type === 'mcq') {
    box.innerHTML = (q.choices || []).map((c, k) => `<button class="ch" data-k="${k}" dir="auto"><b>${'ABCDE'[k]}.</b> ${esc(c)}</button>`).join('');
    const mark = (k, cor) => document.querySelectorAll('.ch').forEach(b => {
      const n = +b.dataset.k; b.disabled = true;
      if (n === cor) b.classList.add('ok'); else if (n === k) b.classList.add('bad');
    });
    if (a) mark(a.chosen_index, a.is_correct ? a.chosen_index : -1);
    if (a && !a.is_correct) sb.rpc('get_answer_key', {qid: q.id}).then(r => { if (!r.error && r.data && qs[i] === q) mark(a.chosen_index, r.data.correct_index) });
    document.querySelectorAll('.ch').forEach(b => b.onclick = async () => {
      if (answered[q.id]) return;
      const k = +b.dataset.k, {data, error} = await sb.rpc('submit_answer', {qid: q.id, idx: k});
      if (error) return alert(accMsg(error));
      answered[q.id] = {chosen_index: k, is_correct: data.is_correct};
      mark(k, data.correct_index);
    });
  } else {
    box.innerHTML = '<textarea id="wa" rows="4" placeholder="اكتب إجابتك هنا..."></textarea><button class="btn" id="rv" style="background:#2a1616">إظهار الإجابة النموذجية</button><div id="mo" class="card" style="display:none" dir="auto"></div>';
    on('#rv', async () => {
      const {data, error} = await sb.rpc('reveal_model_answer', {qid: q.id});
      if (error) return alert(accMsg(error));
      $('#mo').style.display = 'block'; $('#mo').innerHTML = fmtModel(data);
    });
  }

const QR_POS = {1: {p: [36.0, 31.74, 26.37, 33.11], n: [38.09, 65.23, 22.46, 4.69]}, 2: {p: [73.05, 40.43, 20.7, 26.76], n: [74.61, 67.19, 17.84, 4.69]}, 3: {p: [5.6, 45.12, 18.1, 22.66], n: [6.9, 68.75, 15.23, 4.1]}};
const qrBtn = () => '<div class="qrrow"><button class="qrb" id="qr">🏆 Quiz Result</button></div>';
async function qrLoad() {
  const {data} = await sb.from('quiz_results').select('id,title,winners,created_at').order('created_at', {ascending: false});
  return (data || []).map(r => ({id: r.id, title: r.title || '', winners: Array.isArray(r.winners) ? r.winners : [], at: r.created_at}));
}
async function quizResultView() {
  view = 'quizres';
  const back = () => curYear ? blocksView(curYear) : homeView();
  app.innerHTML = topBar() + BK('‹ رجوع') + '<h2>🏆 Quiz Result</h2><p>⏳ جاري التحميل...</p>';
  bindTop(); on('#bk', back);
  const list = await qrLoad();
  app.innerHTML = topBar() + BK('‹ رجوع') + '<h2>🏆 Quiz Result</h2>' +
    (list.length ? list.map(x => '<div style="display:flex;gap:8px;align-items:stretch"><button class="sub qrq" style="flex:1" data-id="' + x.id + '"><b>' + esc(x.title) + '</b><br><small>' + new Date(x.at).toLocaleDateString('ar-EG') + '</small></button>' + (me.is_admin ? '<button class="btn no qrd" style="width:auto;margin:0;padding:0 16px" type="button" data-id="' + x.id + '" title="حذف">🗑</button>' : '') + '</div>').join('') : '<p>لسه مفيش نتايج اختبارات</p>');
  bindTop(); on('#bk', back);
  document.querySelectorAll('.qrq').forEach(b => b.onclick = () => qrShow(list.find(x => String(x.id) === b.dataset.id)));
  document.querySelectorAll('.qrd').forEach(b => b.onclick = async () => {
    const x = list.find(v => String(v.id) === b.dataset.id);
    if (!x || !confirm('تحذف نتيجة "' + x.title + '"؟')) return;
    const {data, error} = await sb.rpc('admin_delete_quiz_result', {p_id: String(x.id)});
    if (error || !data || !data.ok) return alert('حصلت مشكلة: ' + ((error && error.message) || (data && data.error) || ''));
    quizResultView();
  });
}
function qrShow(r) {
  view = 'quizres';
  const w = r.winners.slice(0, 3), medals = ['🥇', '🥈', '🥉'];
  const st = a => 'left:' + a[0] + '%;top:' + a[1] + '%;width:' + a[2] + '%;height:' + a[3] + '%';
  const box = i => {
    const x = w[i - 1] || {}, q = QR_POS[i], nm = (x.name || '').trim();
    return '<div class="qph" style="' + st(q.p) + '">' + (x.photo ? '<img src="' + esc(x.photo) + '" alt="">' : esc(nm.charAt(0))) + '</div>' +
      '<div class="qpl" style="' + st(q.n) + '"><span>' + esc(nm) + '</span></div>';
  };
  const has = w.some(x => x && x.name);
  app.innerHTML = topBar() + BK('‹ الاختبارات') + '<h2>🏆 ' + esc(r.title) + '</h2>' +
    '<div class="qp"><img src="' + QR_IMG + '" alt="">' + box(1) + box(2) + box(3) + '</div>' +
    (has ? w.map((x, i) => x && x.name ? '<div class="card qrl">' + medals[i] + ' <b>' + esc(x.name) + '</b>' + (x.score ? ' — ' + esc(x.score) : '') + '</div>' : '').join('') : '<p>النتيجة لسه ماتنزلتش</p>');
  bindTop(); on('#bk', () => quizResultView());
}
function qrAdminHtml(list) {

    '<input id="qt" placeholder="اسم الاختبار (مثلًا Terminology)">' +
    [1, 2, 3].map(i => '<div class="qre" data-i="' + i + '"><b>المركز ' + i + '</b><input class="qn" placeholder="الاسم"><input class="qs" dir="ltr" placeholder="الدرجة (اختياري)">' +
      '<div class="row"><label class="btn">📷 صورة<input class="qf" type="file" accept="image/*" hidden></label><button class="btn no qx" type="button">حذف الصورة</button></div>' +
      '<img class="qpv" hidden alt=""></div>').join('') +
    '<div class="row"><button class="btn ok" id="qsave" type="button">💾 حفظ</button><button class="btn no" id="qdel" type="button" hidden>🗑 حذف الاختبار</button></div><p class="msg" id="qm"></p></div>';
}
function qrPhoto(file) {
  return new Promise(res => {
    const im = new Image(), u = URL.createObjectURL(file);
    im.onload = () => {
      const n = 260, c = document.createElement('canvas'); c.width = c.height = n;
      const m = Math.min(im.width, im.height);
      c.getContext('2d').drawImage(im, (im.width - m) / 2, (im.height - m) / 2, m, m, 0, 0, n, n);
      URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', 0.8));
    };
    im.onerror = () => res('');
    im.src = u;
  });
}
function qrAdminBind(list) {
  const ph = ['', '', ''], els = [...document.querySelectorAll('.qre')]; let cur = null;
  const setPh = (i, v) => { const pv = els[i].querySelector('.qpv'); ph[i] = v; if (v) { pv.src = v; pv.hidden = false } else { pv.hidden = true; pv.removeAttribute('src') } };
  const fill = id => {
    cur = id ? list.find(x => String(x.id) === String(id)) : null;
    $('#qt').value = cur ? cur.title : '';
    els.forEach((el, i) => { const x = cur ? (cur.winners[i] || {}) : {}; el.querySelector('.qn').value = x.name || ''; el.querySelector('.qs').value = x.score || ''; setPh(i, x.photo || '') });
    $('#qdel').hidden = !cur; $('#qm').textContent = '';
  };
  els.forEach((el, i) => {
    el.querySelector('.qf').onchange = async e => { const f = e.target.files[0]; if (!f) return; const p = await qrPhoto(f); if (p) setPh(i, p) };
    el.querySelector('.qx').onclick = () => setPh(i, '');
  });
  $('#qsel').onchange = e => fill(e.target.value);
  on('#qsave', async () => {
    const t = $('#qt').value.trim(); if (!t) return $('#qm').textContent = 'اكتب اسم الاختبار';
    const ws = els.map((el, i) => ({name: el.querySelector('.qn').value.trim(), score: el.querySelector('.qs').value.trim(), photo: ph[i] || ''}));
    $('#qm').textContent = '...';
    const {data, error} = await sb.rpc('admin_save_quiz_result', {p_id: cur ? cur.id : null, p_title: t, p_winners: ws});
    if (error || !data || !data.ok) return $('#qm').textContent = 'حصلت مشكلة: ' + ((error && (error.message + (error.status ? ' [' + error.status + ']' : ''))) || (data && data.error) || 'مفيش رد من السيرفر');
    alert('تم الحفظ ✅'); adminView();
  });
  on('#qdel', async () => {
    if (!cur || !confirm('تحذف نتيجة "' + cur.title + '"؟')) return;
    const {data, error} = await sb.rpc('admin_delete_quiz_result', {p_id: cur.id});
    if (error || !data || !data.ok) return $('#qm').textContent = 'حصلت مشكلة: ' + ((error && error.message) || (data && data.error) || '');
    adminView();
  });
}

document.onkeydown = e => {
  if (view !== 'quiz' || /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.key === 'ArrowLeft') go(1);
  else if (e.key === 'ArrowRight') go(-1);
  else if (/^[1-5]$/.test(e.key)) { const b = document.querySelectorAll('.ch')[+e.key - 1]; if (b) b.click() }
};

// ===== حماية المحتوى (ردع: مفيش طريقة تمنع تصوير الشاشة 100% من المتصفح) =====
function setWM() {
  const w = document.getElementById('wm');
  if (w) w.remove();
}
(function () {
  let t;
  const hide = ms => { document.body.classList.add('hid'); clearTimeout(t); if (ms) t = setTimeout(show, ms) };
  const show = () => { if (!document.hidden) document.body.classList.remove('hid') };
  const typing = e => e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
  document.addEventListener('visibilitychange', () => document.hidden ? hide() : show());
  window.addEventListener('focus', show);
  window.addEventListener('pageshow', show);
  document.addEventListener('keydown', e => {
    const k = (e.key || '').toLowerCase();
    if (k === 'printscreen' || k === 'meta' && e.shiftKey || (e.metaKey && e.shiftKey && /[345]/.test(k))) {
      hide(2500); try { navigator.clipboard.writeText('') } catch (x) {}
    }
    if ((e.ctrlKey || e.metaKey) && ['p', 's', 'u'].includes(k) || (e.ctrlKey || e.metaKey) && e.shiftKey && ['s', 'i', 'c', 'j'].includes(k) || k === 'f12') e.preventDefault();
  }, true);
  document.addEventListener('keyup', e => { if ((e.key || '').toLowerCase() === 'printscreen') { hide(2500); try { navigator.clipboard.writeText('') } catch (x) {} } }, true);
  ['contextmenu', 'copy', 'cut', 'dragstart', 'selectstart'].forEach(ev => document.addEventListener(ev, e => { if (!typing(e)) e.preventDefault() }, true));
  window.addEventListener('beforeprint', () => hide());
  // جهاز واحد بس: كل 25 ثانية نتأكد إن الجلسة لسه هي الفعّالة
  setInterval(async () => {
    if (!me || me.is_admin || view === 'auth' || view === 'blocked' || document.hidden) return;
    const {data: r} = await sb.rpc('my_access');
    if (r && !r.ok && r.reason === 'other_device') blockedView('other_device');
  }, 25000);
})();

if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(() => {});
